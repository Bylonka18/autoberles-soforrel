<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101d"><title>Rendelés követése</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#070b12;color:#f4f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.wrap{width:min(720px,calc(100% - 22px));margin:auto;padding:24px 0 60px}.card{background:linear-gradient(180deg,#111b2a,#0c141f);border:1px solid #26344a;border-radius:20px;padding:18px;margin-bottom:14px}.yellow{color:#ffc400}.muted{color:#91a0b5;line-height:1.5}.route{font-size:20px;font-weight:950;line-height:1.4;margin:12px 0}.status{display:inline-block;padding:7px 11px;border-radius:999px;background:#ffc400;color:#111827;font-weight:950}.btn{display:block;border:0;border-radius:12px;padding:13px;background:#26354e;color:#fff;font-weight:900;text-decoration:none;text-align:center;cursor:pointer}.form{display:flex;gap:8px}.form input{flex:1;border:1px solid #34435b;border-radius:11px;background:#09111d;color:#fff;padding:12px;font-size:16px}#map{height:330px;border-radius:15px;margin-top:12px;display:none}@media(max-width:560px){.form{display:grid}}</style></head><body><main class="wrap"><section class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><b class="yellow">RENDELÉS KÖVETÉSE</b><h1>Fuvar állapota</h1></div><a class="btn" style="height:max-content" href="/">Főoldal</a></div><div class="form"><input id="idInput" placeholder="Rendelési azonosító"><button id="open" class="btn">MEGNYITÁS</button></div></section><section id="trip" class="card" style="display:none"><span id="status" class="status"></span><div id="route" class="route"></div><div id="details" class="muted"></div><div id="map"></div><div id="gpsInfo" class="muted" style="margin-top:8px"></div></section><section id="error" class="card muted" style="display:none"></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const API='https://zmqfmxcysugdavmmksky.supabase.co/functions/v1/web-api';let map,marker,timer;function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function api(m,p={}){const q=new URLSearchParams({muvelet:m,...p});const r=await fetch(API+'?'+q);return await r.json()}async function load(){const az=idInput.value.trim();if(!az)return;error.style.display='none';const v=await api('utasAppKovetes',{azonosito:az});if(!v.siker){trip.style.display='none';error.style.display='block';error.textContent=v.uzenet||'A rendelés nem található.';return}localStorage.setItem('foglalasAzonosito',az);trip.style.display='block';status.textContent=v.statusz||'';route.textContent=(v.indulas||'')+' → '+(v.cel||'');details.innerHTML=esc(v.datum||'')+' '+esc(v.ido||'Minél hamarabb')+(v.sofor?'<br><b>Sofőr:</b> '+esc(v.sofor):'')+(v.autoTipus?'<br><b>Autó:</b> '+esc(v.autoTipus)+(v.autoSzin?' • '+esc(v.autoSzin):''):'')+(v.rendszam?'<br><b>Rendszám:</b> '+esc(v.rendszam):'')+(v.sorban?'<br><b>'+Number(v.sorban)+'. vagy a sofőr sorában</b>':'')+(Number.isFinite(Number(v.varakozasPerc))&&v.varakozasPerc!==null?'<br>Várható érkezés: kb. '+Number(v.varakozasPerc)+' perc':'');if(v.statusz==='Elvállalva')loadGps(az);else{document.getElementById('map').style.display='none';gpsInfo.textContent='Az élő térkép akkor jelenik meg, amikor a sofőr elvállalta a fuvart.'}}
async function loadGps(az){const v=await api('tripLocation',{azonosito:az});if(!v.siker||!Number.isFinite(Number(v.lat))){gpsInfo.textContent='A sofőr helyzetére várunk...';return}const p=[Number(v.lat),Number(v.lng)];document.getElementById('map').style.display='block';if(!map){map=L.map('map').setView(p,16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);marker=L.marker(p).addTo(map)}else{marker.setLatLng(p);map.panTo(p)}gpsInfo.textContent='Frissítve: '+new Date(v.frissitve).toLocaleTimeString('hu-HU')}
open.onclick=()=>{history.replaceState(null,'','?id='+encodeURIComponent(idInput.value.trim()));load()};const start=new URLSearchParams(location.search).get('id')||localStorage.getItem('foglalasAzonosito')||'';if(start){idInput.value=start;load();timer=setInterval(load,5000)}
</script></body></html>
