<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101d"><title>Rendelés követése</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"><style>*{box-sizing:border-box}body{margin:0;background:#070b12;color:#f4f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.wrap{width:min(720px,calc(100% - 22px));margin:auto;padding:24px 0 60px}.card{background:linear-gradient(180deg,#111b2a,#0c141f);border:1px solid #26344a;border-radius:20px;padding:18px;margin-bottom:14px}.yellow{color:#ffc400}.muted{color:#91a0b5;line-height:1.5}.route{font-size:20px;font-weight:950;line-height:1.4;margin:12px 0}.status{display:inline-block;padding:7px 11px;border-radius:999px;background:#ffc400;color:#111827;font-weight:950}.btn{display:block;border:0;border-radius:12px;padding:13px;background:#26354e;color:#fff;font-weight:900;text-decoration:none;text-align:center;cursor:pointer}.form{display:flex;gap:8px}.form input{flex:1;border:1px solid #34435b;border-radius:11px;background:#09111d;color:#fff;padding:12px;font-size:16px}#cancelBtn{margin-top:12px;width:100%;background:#7f1d1d}#map{height:360px;border-radius:15px;margin-top:12px;display:none;overflow:hidden}.mapFollow{margin-top:9px;display:none;width:100%;background:#ffc400;color:#111827}@media(max-width:560px){.form{display:grid}}</style><script src="/lang.js" defer></script></head><body><main class="wrap"><section class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><b class="yellow">RENDELÉS KÖVETÉSE</b><h1>Fuvar állapota</h1></div><a class="btn" style="height:max-content" href="/">Főoldal</a></div><div class="form"><input id="idInput" placeholder="Rendelési azonosító"><button id="open" class="btn">MEGNYITÁS</button></div></section><section id="trip" class="card" style="display:none"><span id="status" class="status"></span><div id="route" class="route"></div><div id="details" class="muted"></div><button id="cancelBtn" class="btn">RENDELÉS LEMONDÁSA</button><div id="map"></div><button id="followBtn" class="btn mapFollow">📍 SOFŐR KÖVETÉSE: BE</button><div id="gpsInfo" class="muted" style="margin-top:8px"></div></section><section id="error" class="card muted" style="display:none"></section></main><script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script><script>
const API='https://zmqfmxcysugdavmmksky.supabase.co/functions/v1/web-api';let map,marker,timer,followDriver=true,mapProgramMove=false;const MAP_STYLE={version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]};function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function api(m,p={}){const q=new URLSearchParams({muvelet:m,...p});const r=await fetch(API+'?'+q);return await r.json()}async function load(){const az=idInput.value.trim();if(!az)return;error.style.display='none';const v=await api('utasAppKovetes',{azonosito:az});if(!v.siker){trip.style.display='none';error.style.display='block';error.textContent=v.uzenet||'A rendelés nem található.';return}localStorage.setItem('foglalasAzonosito',az);trip.style.display='block';status.textContent=v.statusz||'';route.textContent=(v.indulas||'')+' → '+(v.cel||'');details.innerHTML=esc(v.datum||'')+' '+esc(v.ido||tr('Minél hamarabb'))+(v.sofor?'<br><b>'+tr('Sofőr:')+'</b> '+esc(v.sofor):'')+(v.autoTipus?'<br><b>'+tr('Autó:')+'</b> '+esc(v.autoTipus)+(v.autoSzin?' • '+esc(v.autoSzin):''):'')+(v.rendszam?'<br><b>'+tr('Rendszám:')+'</b> '+esc(v.rendszam):'')+(v.sorban?'<br><b>'+Number(v.sorban)+'. '+tr('vagy a sofőr sorában')+'</b>':'')+(Number.isFinite(Number(v.varakozasPerc))&&v.varakozasPerc!==null?'<br>'+tr('Várható érkezés: kb.')+' '+Number(v.varakozasPerc)+' '+tr('perc'):'');cancelBtn.style.display=['Új rendelés','Elvállalva'].includes(v.statusz)?'block':'none';if(v.statusz==='Elvállalva')loadGps(az);else{document.getElementById('map').style.display='none';gpsInfo.textContent=tr('Az élő térkép akkor jelenik meg, amikor a sofőr elvállalta a fuvart.')}}
async function loadGps(az){const v=await api('tripLocation',{azonosito:az});if(!v.siker||!Number.isFinite(Number(v.lat))){gpsInfo.textContent=tr('A sofőr helyzetére várunk...');return}const p=[Number(v.lng),Number(v.lat)];document.getElementById('map').style.display='block';followBtn.style.display='block';if(!map){map=new maplibregl.Map({container:'map',style:MAP_STYLE,center:p,zoom:16,attributionControl:true});map.addControl(new maplibregl.NavigationControl({showCompass:true}),'top-right');const el=document.createElement('div');el.style.cssText='width:34px;height:34px;border-radius:50%;background:#ffc400;border:4px solid #fff;box-shadow:0 2px 12px #0008';marker=new maplibregl.Marker({element:el}).setLngLat(p).addTo(map);map.on('dragstart',()=>{if(!mapProgramMove){followDriver=false;followBtn.textContent='📍 SOFŐR KÖVETÉSE: KI'}})}else{marker.setLngLat(p);if(followDriver){mapProgramMove=true;map.easeTo({center:p,duration:900,essential:true});setTimeout(()=>mapProgramMove=false,950)}}gpsInfo.textContent='Frissítve: '+new Date(v.frissitve).toLocaleTimeString('hu-HU')}followBtn.onclick=()=>{followDriver=!followDriver;followBtn.textContent='📍 SOFŐR KÖVETÉSE: '+(followDriver?'BE':'KI');if(followDriver&&marker&&map){const p=marker.getLngLat();mapProgramMove=true;map.easeTo({center:[p.lng,p.lat],zoom:Math.max(map.getZoom(),15),duration:700,essential:true});setTimeout(()=>mapProgramMove=false,750)}}
cancelBtn.onclick=async()=>{const az=idInput.value.trim();if(!az)return;if(!confirm('Biztosan lemondod a rendelést?'))return;cancelBtn.disabled=true;cancelBtn.textContent='LEMondás...';const v=await api('utasRendelesLemondas',{azonosito:az});if(v.siker){clearInterval(timer);localStorage.removeItem('foglalasAzonosito');trip.style.display='none';error.style.display='block';error.textContent='A rendelés sikeresen lemondva.'}else{alert(v.uzenet||'A lemondás nem sikerült.');cancelBtn.disabled=false;cancelBtn.textContent='RENDELÉS LEMONDÁSA'}};
open.onclick=()=>{history.replaceState(null,'','?id='+encodeURIComponent(idInput.value.trim()));load()};const start=new URLSearchParams(location.search).get('id')||localStorage.getItem('foglalasAzonosito')||'';if(start){idInput.value=start;load();timer=setInterval(load,5000)}
</script></body></html>
