<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>Rendelés megerősítése – Autóbérlés sofőrrel</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,rgba(255,196,0,.10),transparent 28%),#070b12;color:#f4f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;display:grid;place-items:center;padding:18px}
.box{width:min(520px,100%);background:linear-gradient(180deg,#111b2a,#0c141f);border:1px solid #26344a;border-radius:24px;padding:26px;box-shadow:0 22px 60px rgba(0,0,0,.35);text-align:center}
.brand{font-weight:950;color:#ffc400;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:32px;line-height:1.1;margin:12px 0}
p{color:#aeb9c7;line-height:1.55}
button{width:100%;margin-top:12px;border:0;border-radius:14px;background:linear-gradient(135deg,#ffc400,#ffdb68);color:#111827;font-weight:950;font-size:17px;padding:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{margin-top:18px;padding:14px;border-radius:14px;display:none;font-weight:850;line-height:1.45}
.ok{display:block;background:rgba(71,220,135,.10);border:1px solid rgba(71,220,135,.28);color:#9bf0bd}
.err{display:block;background:rgba(255,105,105,.10);border:1px solid rgba(255,105,105,.28);color:#ffb2b2}
.back{display:none;margin-top:14px;text-decoration:none;background:#243249;color:#fff;border-radius:13px;padding:13px;font-weight:900}
</style>
</head>
<body>
<main class="box">
  <div class="brand">Autóbérlés sofőrrel – Kiskőrös</div>
  <h1>Fuvarrendelés megerősítése</h1>
  <p id="leiras">A rendelés véglegesítéséhez nyomd meg az alábbi gombot.</p>
  <button id="gomb">✅ MEGERŐSÍTEM A RENDELÉST</button>
  <div id="uzenet" class="msg"></div>
  <a id="kovetes" class="back" href="/rendeles/">📍 Rendelés / követés</a>
</main>
<script>
const API="https://script.google.com/macros/s/AKfycbz_9Rzy2acFm9sOKGJfvghOSt1TO3SCukRd3XJ5j3-YwdqkovGpwflaln63gAEWu74W/exec";
const TOKEN=String(new URLSearchParams(location.search).get('token')||'').trim();
function jsonp(m,args=[],timeout=25000){return new Promise((resolve,reject)=>{const cb='__m_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),q=new URLSearchParams({api:'1',muvelet:'webHivas',callback:cb,nev:m,args:encodeURIComponent(JSON.stringify(args)),sessionToken:''});const t=setTimeout(()=>{clean();reject(new Error('timeout'))},timeout);function clean(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=d=>{clean();resolve(d)};s.onerror=()=>{clean();reject(new Error('net'))};s.src=API+'?'+q.toString();document.body.appendChild(s)})}
async function megerosit(){const g=document.getElementById('gomb'),u=document.getElementById('uzenet');if(!TOKEN){u.className='msg err';u.textContent='Hiányzó vagy hibás megerősítő link.';g.style.display='none';return;}g.disabled=true;g.textContent='⏳ ELLENŐRZÉS...';try{const v=await jsonp('foglalasEmailMegerositese',[TOKEN],30000);u.className='msg '+(v&&v.siker?'ok':'err');u.textContent=v&&v.uzenet?v.uzenet:'Ismeretlen válasz.';if(v&&v.siker){g.style.display='none';document.getElementById('leiras').textContent='A rendelésed megerősítése sikerült.';const id=String(v.foglalasiAzonosito||v.azonosito||'');const link=document.getElementById('kovetes');if(id){localStorage.setItem('foglalasAzonosito',id);link.href='/kovetes/?id='+encodeURIComponent(id)}else{link.href='/rendeles/'}link.style.display='block'}else{g.disabled=false;g.textContent='✅ MEGERŐSÍTEM A RENDELÉST'}}catch(e){u.className='msg err';u.textContent='Kapcsolati hiba. Próbáld újra!';g.disabled=false;g.textContent='✅ MEGERŐSÍTEM A RENDELÉST'}}
document.getElementById('gomb').onclick=megerosit;
</script>
</body>
</html>
