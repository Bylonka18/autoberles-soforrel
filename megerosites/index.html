<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101d"><title>Rendelés megerősítése</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070b12;color:#f4f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.card{width:min(560px,calc(100% - 24px));background:linear-gradient(180deg,#111b2a,#0c141f);border:1px solid #26344a;border-radius:22px;padding:24px;text-align:center}.yellow{color:#ffc400}.muted{color:#91a0b5;line-height:1.55}.btn{display:block;width:100%;border:0;border-radius:13px;padding:14px;background:#ffc400;color:#111827;font-weight:950;text-decoration:none;cursor:pointer;margin-top:14px}.msg{margin-top:16px;font-weight:850}.ok{color:#79e6a4}.err{color:#ff9b9b}</style></head><body><main class="card"><h1 class="yellow">Rendelés megerősítése</h1><p id="desc" class="muted">Ellenőrizzük az emailedet és a rendelésedet.</p><button id="confirm" class="btn">MEGERŐSÍTÉS</button><div id="msg" class="msg"></div><a id="track" class="btn" style="display:none" href="/kovetes/">RENDELÉS KÖVETÉSE</a></main><script>
const API='https://zmqfmxcysugdavmmksky.supabase.co/functions/v1/web-api';
const az=new URLSearchParams(location.search).get('id')||'';const token=new URLSearchParams(location.hash.slice(1)).get('access_token')||'';
async function run(){if(!az||!token){msg.className='msg err';msg.textContent='A megerősítő link hiányos vagy lejárt.';confirm.style.display='none';return}confirm.disabled=true;confirm.textContent='ELLENŐRZÉS...';try{const q=new URLSearchParams({muvelet:'webHivas',nev:'confirmBooking',args:encodeURIComponent(JSON.stringify([az])),sessionToken:token});const r=await fetch(API+'?'+q);const v=await r.json();if(!v.siker)throw new Error(v.uzenet||'Nem sikerült.');localStorage.setItem('utasToken',token);localStorage.setItem('foglalasAzonosito',az);history.replaceState(null,'',location.pathname+'?id='+encodeURIComponent(az));msg.className='msg ok';msg.textContent='A rendelésed megerősítése sikerült.';desc.textContent='A rendelésed bekerült a sofőrök rendszerébe.';confirm.style.display='none';track.href='/kovetes/?id='+encodeURIComponent(az);track.style.display='block'}catch(e){msg.className='msg err';msg.textContent=e.message||'Nem sikerült megerősíteni.';confirm.disabled=false;confirm.textContent='ÚJRA MEGPRÓBÁLOM'}}confirm.onclick=run;run();
</script></body></html>
