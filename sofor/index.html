<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>Sofőr belépés – Autóbérlés sofőrrel</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,rgba(255,196,0,.1),transparent 28%),#070b12;color:#f4f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;display:grid;place-items:center;padding:18px}
.box{width:min(440px,100%);background:linear-gradient(180deg,#111b2a,#0c141f);border:1px solid #26344a;border-radius:24px;padding:24px;box-shadow:0 22px 60px rgba(0,0,0,.35)}
.back{display:inline-block;color:#fff;text-decoration:none;border:1px solid #334157;border-radius:11px;padding:9px 12px;font-weight:800;font-size:13px}
.ey{margin-top:24px;color:#ffc400;font-size:12px;font-weight:950;letter-spacing:.13em;text-transform:uppercase}
h1{margin:7px 0 18px;font-size:34px}
label{display:block;margin:14px 0 7px;font-weight:850}
input{width:100%;background:#09111d;color:#fff;border:1px solid #34435b;border-radius:13px;padding:14px;font-size:16px;outline:none}
input:focus{border-color:#ffc400}
.go{width:100%;margin-top:20px;border:0;border-radius:14px;background:linear-gradient(135deg,#ffc400,#ffdb68);color:#111827;font-size:16px;font-weight:950;padding:15px;cursor:pointer}
.go:disabled{opacity:.6}.msg{min-height:24px;margin-top:14px;font-weight:800;color:#ff9b9b}
</style>
</head>
<body>
<main class="box">
<a class="back" href="/">← Főoldal</a>
<div class="ey">Autóbérlés sofőrrel – Kiskőrös</div>
<h1>Sofőr belépés</h1>
<label>Felhasználónév</label><input id="felh" autocomplete="username">
<label>Jelszó</label><input id="jel" type="password" autocomplete="current-password">
<button id="go" class="go">BELÉPÉS</button>
<div id="msg" class="msg"></div>
</main>
<script>
const API="https://script.google.com/macros/s/AKfycbz_9Rzy2acFm9sOKGJfvghOSt1TO3SCukRd3XJ5j3-YwdqkovGpwflaln63gAEWu74W/exec";
function jsonp(m,p={},timeout=20000){return new Promise((resolve,reject)=>{const cb='__l_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),q=new URLSearchParams({api:'1',muvelet:m,callback:cb});Object.entries(p).forEach(([k,v])=>q.set(k,String(v)));const t=setTimeout(()=>{cleanup();reject(new Error('timeout'));},timeout);function cleanup(){clearTimeout(t);delete window[cb];s.remove();}window[cb]=d=>{cleanup();resolve(d)};s.onerror=()=>{cleanup();reject(new Error('net'))};s.src=API+'?'+q.toString();document.body.appendChild(s);})}
async function sha256(t){const b=new TextEncoder().encode(t),h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function belep(){const g=document.getElementById('go'),u=document.getElementById('msg'),felh=document.getElementById('felh').value.trim(),jel=document.getElementById('jel').value;if(!felh||!jel){u.textContent='Add meg a felhasználónevet és a jelszót!';return;}g.disabled=true;g.textContent='BELÉPÉS...';u.textContent='';try{const v=await jsonp('soforBelepesHash',{felhasznalo:felh,jelszoHash:await sha256(jel)});if(!v||!v.siker){u.textContent=v&&v.uzenet?v.uzenet:'Sikertelen belépés.';return;}localStorage.setItem('soforToken',v.token);if(v.nev)localStorage.setItem('soforNev',v.nev);location.href='/sofor/panel/';}catch(e){u.textContent='Kapcsolati hiba. Próbáld újra!';}finally{g.disabled=false;g.textContent='BELÉPÉS';}}
document.getElementById('go').onclick=belep;
document.getElementById('jel').addEventListener('keydown',e=>{if(e.key==='Enter')belep();});
</script>
</body>
</html>
