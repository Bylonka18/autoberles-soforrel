<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sofőrök elérhetősége</title><style>body{margin:0;background:#050b12;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:620px;margin:40px auto;padding:16px}.card{background:#111d2c;border:1px solid #ffc400;border-radius:20px;padding:22px}h1{font-size:25px;margin:8px 0 18px}.box{border:1px solid #344861;border-radius:14px;padding:18px;font-size:18px;line-height:1.5}.btn{display:block;background:#ffc400;color:#08111d;text-decoration:none;text-align:center;font-weight:900;padding:14px;border-radius:12px;margin-top:16px}</style></head><body><div class="wrap"><div class="card"><b style="color:#ffc400">AUTÓBÉRLÉS SOFŐRREL – KISKŐRÖS</b><h1>Sofőrök várható elérhetősége</h1><div id="eredmeny" class="box">🕐 Számítás...</div><a class="btn" href="/sofor/panel/">VISSZA A SOFŐR PANELHEZ</a></div></div><script>const API='https://zmqfmxcysugdavmmksky.supabase.co/functions/v1/web-api',TOKEN=localStorage.getItem('soforToken')||'';function jsonp(m,p={},timeout=15000){return new Promise((resolve,reject)=>{const cb='__e_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),q=new URLSearchParams({api:'1',muvelet:m,callback:cb});Object.entries(p).forEach(([k,v])=>q.set(k,String(v)));const t=setTimeout(()=>{clean();reject(new Error('timeout'))},timeout);function clean(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=d=>{clean();resolve(d)};s.onerror=()=>{clean();reject(new Error('net'))};s.src=API+'?'+q;document.body.appendChild(s)})}async function load(){const e=document.getElementById('eredmeny');try{const v=await jsonp('webHivas',{nev:'soforKovetkezoSzabad',args:encodeURIComponent('[]'),sessionToken:TOKEN});if(!v||!v.siker){e.textContent='Nem sikerült kiszámolni.';return}if(!v.elerheto){e.textContent=v.uzenet||'Nincs elérhető sofőr.';return}const p=Math.max(0,Number(v.perc)||0),t=new Date(Date.now()+p*60000),ora=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');e.textContent=p<=0?'🟢 '+v.nev+' most szabad':'🕐 '+v.nev+' várhatóan kb. '+p+' perc múlva lesz szabad ('+ora+')'}catch(x){e.textContent='A számítás most nem érhető el.'}}load();</script></body></html>
