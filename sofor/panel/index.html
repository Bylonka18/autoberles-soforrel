<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b12"><title>Sofőr panel – Autóbérlés sofőrrel</title><style>
*{box-sizing:border-box}body{margin:0;background:#060a10;color:#f4f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.wrap{width:min(760px,calc(100% - 20px));margin:auto;padding:14px 0 50px}.head,.card{background:linear-gradient(180deg,#111b2a,#0c141f);border:1px solid #26344a;border-radius:18px;padding:16px;margin-bottom:13px}.head{border-color:#d7aa17}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.yellow{color:#ffc400}.muted{color:#91a0b5}.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:900;cursor:pointer}.yellowBtn{background:#ffc400;color:#111827}.darkBtn{background:#26354e;color:#fff}.redBtn{background:#4a1720;color:#ffb0b8}.greenBtn{background:#2ecc71;color:#07162e}.btn:disabled{opacity:.55}.status{padding:12px;border-radius:12px;background:#101a2a;border:1px solid #32445f;margin-top:10px}.trip{padding:15px;border:1px solid #304059;border-radius:15px;margin-top:11px;background:#0a111c}.trip.new{border-color:#ffc400}.trip.mine{border-color:#2ecc71}.route{font-size:16px;font-weight:850;line-height:1.45}.meta{margin-top:8px;color:#b7c2d0;font-size:14px;line-height:1.5}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.actions a{text-decoration:none;text-align:center}.gps{font-size:13px;color:#7fe3a1;margin-top:8px}.form{display:none}.form.open{display:block}label{display:block;margin:10px 0 5px;font-weight:800}input,textarea,select{width:100%;border:1px solid #34435b;border-radius:11px;background:#09111d;color:#fff;padding:12px;font-size:16px}textarea{min-height:70px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.empty{text-align:center;color:#91a0b5;padding:22px}.toplinks{display:flex;gap:8px}.toplinks a{text-decoration:none}@media(max-width:560px){.grid2,.actions{grid-template-columns:1fr}.wrap{width:min(100% - 14px,760px)}}
</style></head><body><main class="wrap"><section class="head"><div class="row"><div><b class="yellow">SOFŐR PANEL</b><div id="nev" class="muted"></div></div><div class="toplinks"><a class="btn darkBtn" href="/">Főoldal</a><button class="btn redBtn" onclick="logout()">Kijelentkezés</button></div></div><div id="munka" class="status">Állapot betöltése...</div><button id="munkaBtn" class="btn yellowBtn" style="width:100%;margin-top:9px" onclick="munkaValtas()">ÁLLAPOT VÁLTÁSA</button><div id="gps" class="gps">GPS: nincs aktív fuvar</div></section>
<section class="card"><button class="btn yellowBtn" style="width:100%" onclick="document.getElementById('form').classList.toggle('open')">+ FUVAR HOZZÁADÁSA</button><div id="form" class="form"><label>Név</label><input id="fnev"><label>Telefon</label><input id="ftel" type="tel"><label>Indulás</label><input id="find"><label>Cél</label><input id="fcel"><div class="grid2"><div><label>Dátum</label><input id="fdatum" type="date"></div><div><label>Idő</label><input id="fido" type="time"></div></div><label>Utasok</label><input id="futas" type="number" min="1" value="1"><label>Megjegyzés</label><textarea id="fmegj"></textarea><button class="btn greenBtn" style="width:100%;margin-top:12px" onclick="fuvarHozzaad()">MENTÉS</button><div id="formMsg" class="muted" style="margin-top:8px"></div></div></section>
<section class="card"><div class="row"><b>Aktív fuvarok</b><button class="btn darkBtn" onclick="betolt()">Frissítés</button></div><div id="lista"><div class="empty">Betöltés...</div></div></section></main>
<script>
const API='https://script.google.com/macros/s/AKfycbz_9Rzy2acFm9sOKGJfvghOSt1TO3SCukRd3XJ5j3-YwdqkovGpwflaln63gAEWu74W/exec';const TOKEN=localStorage.getItem('soforToken')||'',SOFOR_NEV=localStorage.getItem('soforNev')||'';if(!TOKEN)location.replace('/sofor/');document.getElementById('nev').textContent=SOFOR_NEV||'Bejelentkezve';let gpsWatch=null,gpsTimer=null,gpsTrip='';let lastPos=null;
function jsonp(m,p={},timeout=25000){return new Promise((resolve,reject)=>{const cb='__s_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),q=new URLSearchParams({api:'1',muvelet:m,callback:cb});Object.entries(p).forEach(([k,v])=>q.set(k,String(v)));const t=setTimeout(()=>{clean();reject(new Error('timeout'))},timeout);function clean(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=d=>{clean();resolve(d)};s.onerror=()=>{clean();reject(new Error('net'))};s.src=API+'?'+q.toString();document.body.appendChild(s)})}
function call(nev,args=[]){return jsonp('webHivas',{nev,args:encodeURIComponent(JSON.stringify(args)),sessionToken:TOKEN},30000)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function expired(v){if(v&&!v.siker&&/lejárt|munkamenet/i.test(v.uzenet||'')){localStorage.removeItem('soforToken');localStorage.removeItem('soforNev');location.replace('/sofor/');return true}return false}
async function munkaBetolt(){const v=await call('soforSajatDolgozikAllapot',[TOKEN]);if(expired(v)||!v||!v.siker)return;document.getElementById('munka').textContent=v.dolgozik?'🟢 Dolgozom – kaphatok fuvarokat':'⚫ Nem dolgozom';document.getElementById('munkaBtn').textContent=v.dolgozik?'NEM DOLGOZOM':'DOLGOZOM'}async function munkaValtas(){const g=document.getElementById('munkaBtn');g.disabled=true;try{const v=await call('soforSajatDolgozikValtas',[TOKEN]);expired(v);await munkaBetolt()}finally{g.disabled=false}}
function telLink(t){return 'tel:'+String(t||'').replace(/[^+0-9]/g,'')}function navLink(c){return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(c||'')}
function render(fs){const d=document.getElementById('lista');if(!Array.isArray(fs)||!fs.length){d.innerHTML='<div class="empty">Nincs aktív fuvar.</div>';return}d.innerHTML=fs.map(f=>{const mine=String(f.sofor||'').toLowerCase()===String(SOFOR_NEV||'').toLowerCase(),newr=f.statusz==='Új rendelés';let btn='';if(newr)btn='<button class="btn yellowBtn" onclick="elfogad('+Number(f.sor)+',\''+esc(String(f.azonosito||''))+'\')">ELVÁLLALOM</button>';else if(f.statusz==='Elvállalva'&&mine)btn='<button class="btn greenBtn" onclick="kesz('+Number(f.sor)+',\''+esc(String(f.azonosito||''))+'\')">KÉSZ</button>';return '<div class="trip '+(newr?'new ':'')+(mine?'mine':'')+'"><div class="route">'+esc(f.indulas)+' → '+esc(f.cel)+'</div><div class="meta">'+esc(f.datum)+' '+esc(f.ido||'Minél hamarabb')+'<br>'+esc(f.nev||'')+' • '+esc(f.telefon||'')+'<br>Státusz: '+esc(f.statusz||'')+(f.sofor?'<br>Sofőr: '+esc(f.sofor):'')+(f.megjegyzes?'<br>Megjegyzés: '+esc(f.megjegyzes):'')+'</div><div class="actions"><a class="btn darkBtn" href="'+telLink(f.telefon)+'">HÍVÁS</a><a class="btn darkBtn" target="_blank" href="'+navLink(f.indulas)+'">NAVIGÁCIÓ</a>'+btn+'</div></div>'}).join('')}
async function betolt(){try{const v=await call('ujFuvarokLekerdezese',[TOKEN]);if(expired(v))return;if(Array.isArray(v))render(v);else if(v&&v.siker&&Array.isArray(v.lista))render(v.lista);else if(Array.isArray(v?.fuvarok))render(v.fuvarok);else render(v)}catch(e){document.getElementById('lista').innerHTML='<div class="empty">Kapcsolati hiba.</div>'}}
function gpsStop(){if(gpsWatch!==null&&navigator.geolocation)navigator.geolocation.clearWatch(gpsWatch);if(gpsTimer)clearInterval(gpsTimer);gpsWatch=null;gpsTimer=null;gpsTrip='';lastPos=null;document.getElementById('gps').textContent='GPS: nincs aktív fuvar'}function gpsSend(){if(!gpsTrip||!lastPos)return;call('soforAppHelyzetFrissites',[TOKEN,gpsTrip,lastPos.lat,lastPos.lng]).then(v=>{if(v&&v.siker)document.getElementById('gps').textContent='🟢 GPS aktív – utolsó küldés: '+new Date().toLocaleTimeString('hu-HU')})}function gpsStart(id,pos){gpsStop();gpsTrip=id;if(pos)lastPos={lat:pos.coords.latitude,lng:pos.coords.longitude};document.getElementById('gps').textContent='🟢 GPS helyzetmegosztás aktív';if(navigator.geolocation){gpsWatch=navigator.geolocation.watchPosition(p=>{lastPos={lat:p.coords.latitude,lng:p.coords.longitude}},()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:15000})}gpsSend();gpsTimer=setInterval(gpsSend,15000)}
function elfogad(sor,id){const go=pos=>call('fuvarElvallalasa',[sor,TOKEN]).then(v=>{if(!v||!v.siker){alert(v?.uzenet||'Nem sikerült elvállalni.');return}gpsStart(id,pos);betolt()});if(navigator.geolocation)navigator.geolocation.getCurrentPosition(go,()=>go(null),{enableHighAccuracy:true,timeout:12000});else go(null)}async function kesz(sor,id){const v=await call('fuvarKesz',[sor,TOKEN]);if(!v||!v.siker){alert(v?.uzenet||'Nem sikerült lezárni.');return}if(gpsTrip===id)gpsStop();betolt()}
async function fuvarHozzaad(){const a={nev:fnev.value.trim(),telefon:ftel.value.trim(),indulas:find.value.trim(),cel:fcel.value.trim(),datum:fdatum.value,ido:fido.value,utasok:futas.value,megjegyzes:fmegj.value.trim()};const m=document.getElementById('formMsg');if(!a.nev||!a.telefon||!a.indulas||!a.cel){m.textContent='Töltsd ki a nevet, telefonszámot, indulást és célt.';return}const v=await call('soforFuvarHozzaadas',[TOKEN,a]);m.textContent=v?.uzenet||'';if(v&&v.siker){document.getElementById('form').classList.remove('open');betolt()}}
async function logout(){try{await call('soforKijelentkezes',[TOKEN])}catch(e){}gpsStop();localStorage.removeItem('soforToken');localStorage.removeItem('soforNev');location.replace('/sofor/')}
munkaBetolt();betolt();setInterval(betolt,10000);window.addEventListener('beforeunload',()=>{if(gpsWatch!==null&&navigator.geolocation)navigator.geolocation.clearWatch(gpsWatch);if(gpsTimer)clearInterval(gpsTimer)});
</script></body></html>
