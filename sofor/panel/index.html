<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>Sofőr panel – Autóbérlés sofőrrel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#060a10;color:#f4f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{width:min(760px,calc(100% - 20px));margin:auto;padding:14px 0 50px}
.head,.card{background:linear-gradient(180deg,#111b2a,#0c141f);border:1px solid #26344a;border-radius:18px;padding:16px;margin-bottom:13px}
.head{border-color:#d7aa17}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.yellow{color:#ffc400}.muted{color:#91a0b5}
.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:900;cursor:pointer}
.yellowBtn{background:#ffc400;color:#111827}.darkBtn{background:#26354e;color:#fff}.redBtn{background:#4a1720;color:#ffb0b8}.greenBtn{background:#2ecc71;color:#07162e}
.btn:disabled{opacity:.55}.status{padding:12px;border-radius:12px;background:#101a2a;border:1px solid #32445f;margin-top:10px}
.trip{padding:15px;border:1px solid #304059;border-radius:15px;margin-top:11px;background:#0a111c}.trip.new{border-color:#ffc400}.trip.mine{border-color:#2ecc71}
.route{font-size:16px;font-weight:850;line-height:1.45}.meta{margin-top:8px;color:#b7c2d0;font-size:14px;line-height:1.5}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.actions a{text-decoration:none;text-align:center}
.gps{font-size:13px;color:#7fe3a1;margin-top:8px}
.form{display:none}.form.open{display:block}
label{display:block;margin:10px 0 5px;font-weight:800}
input,textarea,select{width:100%;border:1px solid #34435b;border-radius:11px;background:#09111d;color:#fff;padding:12px;font-size:16px}
textarea{min-height:70px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{text-align:center;color:#91a0b5;padding:22px}.toplinks{display:flex;gap:8px}.toplinks a{text-decoration:none}
.searchWrap{position:relative}.suggest{display:none;position:absolute;left:0;right:0;top:100%;z-index:20;background:#0a1220;border:1px solid #394b66;border-radius:12px;box-shadow:0 15px 35px rgba(0,0,0,.35);max-height:280px;overflow:auto}
.suggest.open{display:block}.sug{padding:11px 12px;border-bottom:1px solid #1f2c3d;cursor:pointer}.sug:last-child{border-bottom:0}.sug b{display:block}.sug small{color:#95a4b8}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.chip{border:1px solid #3b4a61;background:#121c2a;color:#dbe5f2;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer}
.timeChoice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.timeBtn{padding:12px;border:1px solid #34435b;border-radius:12px;background:#101827;color:#c7d0dc;font-weight:900;cursor:pointer}.timeBtn.active{background:#ffc400;color:#111827;border-color:#ffc400}
#idopontBox{display:none}.okmsg{color:#7fe3a1}.errmsg{color:#ff9b9b}
@media(max-width:560px){.grid2,.actions,.timeChoice{grid-template-columns:1fr}.wrap{width:min(100% - 14px,760px)}}
</style>
</head>
<body>
<main class="wrap">
<section class="head">
  <div class="row">
    <div><b class="yellow">SOFŐR PANEL</b><div id="nev" class="muted"></div></div>
    <div class="toplinks"><a class="btn darkBtn" href="/">Főoldal</a><button class="btn redBtn" onclick="logout()">Kijelentkezés</button></div>
  </div>
  <div id="munka" class="status">Állapot betöltése...</div>
  <button id="munkaBtn" class="btn yellowBtn" style="width:100%;margin-top:9px" onclick="munkaValtas()">ÁLLAPOT VÁLTÁSA</button>
  <div id="gps" class="gps">GPS: nincs aktív fuvar</div>
</section>
<section class="card">
  <button class="btn yellowBtn" style="width:100%" onclick="toggleForm()">+ FUVAR HOZZÁADÁSA</button>
  <div id="form" class="form">
    <label>Korábbi utas keresése</label><div class="searchWrap"><input id="ugyfelKeres" placeholder="Kezdd el írni a nevet vagy telefonszámot..." autocomplete="off"><div id="ugyfelJavaslatok" class="suggest"></div></div>
    <label>Név</label><input id="fnev" autocomplete="name"><label>Telefon</label><input id="ftel" type="tel" autocomplete="tel"><label>Email <span class="muted">(nem kötelező)</span></label><input id="femail" type="email" autocomplete="email">
    <label>Indulás</label><input id="find"><div id="indulasCimek" class="quick"></div><label>Cél</label><input id="fcel"><div id="celCimek" class="quick"></div>
    <label>Mikor?</label><div class="timeChoice"><button type="button" id="mostBtn" class="timeBtn active" onclick="idoMod('azonnali')">⚡ MINÉL HAMARABB</button><button type="button" id="idopontBtn" class="timeBtn" onclick="idoMod('idopont')">🕒 IDŐPONTRA</button></div>
    <div id="idopontBox" class="grid2"><div><label>Dátum</label><input id="fdatum" type="date"></div><div><label>Idő</label><input id="fido" type="time"></div></div>
    <label>Utasok</label><input id="futas" type="number" min="1" value="1"><label>Megjegyzés</label><textarea id="fmegj"></textarea><button id="mentesBtn" class="btn greenBtn" style="width:100%;margin-top:12px" onclick="fuvarHozzaad()">MENTÉS</button><div id="formMsg" class="muted" style="margin-top:8px"></div>
  </div>
</section>
<section class="card"><div class="row"><b>Aktív fuvarok</b><button class="btn darkBtn" onclick="betolt()">Frissítés</button></div><div id="lista"><div class="empty">Betöltés...</div></div></section>
</main>
<script>
const API='https://script.google.com/macros/s/AKfycbz_9Rzy2acFm9sOKGJfvghOSt1TO3SCukRd3XJ5j3-YwdqkovGpwflaln63gAEWu74W/exec';
const TOKEN=localStorage.getItem('soforToken')||'',SOFOR_NEV=localStorage.getItem('soforNev')||'';if(!TOKEN)location.replace('/sofor/');document.getElementById('nev').textContent=SOFOR_NEV||'Bejelentkezve';
let gpsWatch=null,gpsTimer=null,gpsTrip='',lastPos=null,gpsKuldesFolyamatban=false;let rendelesTipus='azonnali',ugyfelTimer=null,kivalasztottUgyfel=null;const ugyfelCache={};
function jsonp(m,p={},timeout=25000){return new Promise((resolve,reject)=>{const cb='__s_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),q=new URLSearchParams({api:'1',muvelet:m,callback:cb});Object.entries(p).forEach(([k,v])=>q.set(k,String(v)));const t=setTimeout(()=>{clean();reject(new Error('timeout'))},timeout);function clean(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=d=>{clean();resolve(d)};s.onerror=()=>{clean();reject(new Error('net'))};s.src=API+'?'+q.toString();document.body.appendChild(s)})}
function call(nev,args=[]){return jsonp('webHivas',{nev,args:encodeURIComponent(JSON.stringify(args)),sessionToken:TOKEN},30000)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function expired(v){if(v&&!v.siker&&/lejárt|munkamenet/i.test(v.uzenet||'')){localStorage.removeItem('soforToken');localStorage.removeItem('soforNev');location.replace('/sofor/');return true}return false}
function toggleForm(){document.getElementById('form').classList.toggle('open')}function idoMod(mod){rendelesTipus=mod;document.getElementById('mostBtn').classList.toggle('active',mod==='azonnali');document.getElementById('idopontBtn').classList.toggle('active',mod==='idopont');document.getElementById('idopontBox').style.display=mod==='idopont'?'grid':'none';if(mod==='idopont'){const d=new Date();document.getElementById('fdatum').value=d.toISOString().slice(0,10)}}idoMod('azonnali');
function munkaKirajzol(v){if(!v||!v.siker)return;document.getElementById('munka').textContent=v.dolgozik?'🟢 Dolgozom – kaphatok fuvarokat':'⚫ Nem dolgozom';document.getElementById('munkaBtn').textContent=v.dolgozik?'MUNKA LEÁLLÍTÁSA':'MUNKA INDÍTÁSA'}async function munkaBetolt(){const v=await call('soforSajatDolgozikAllapot',[TOKEN]);if(expired(v)||!v||!v.siker)return;munkaKirajzol(v)}async function munkaValtas(){const g=document.getElementById('munkaBtn');g.disabled=true;try{const v=await call('soforSajatDolgozikValtas',[TOKEN]);expired(v);await munkaBetolt()}finally{g.disabled=false}}
function telLink(t){return 'tel:'+String(t||'').replace(/[^+0-9]/g,'')}function navLink(c){return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(c||'')}
function render(fs){const d=document.getElementById('lista');if(!Array.isArray(fs)||!fs.length){d.innerHTML='<div class="empty">Nincs aktív fuvar.</div>';return}d.innerHTML=fs.map(f=>{const mine=String(f.sofor||'').toLowerCase()===String(SOFOR_NEV||'').toLowerCase(),newr=f.statusz==='Új rendelés';let btn='';if(newr)btn='<button class="btn yellowBtn" onclick="elfogad('+Number(f.sor)+',\''+esc(String(f.azonosito||''))+'\')">ELVÁLLALOM</button>';else if(f.statusz==='Elvállalva'&&mine)btn='<button class="btn greenBtn" onclick="kesz('+Number(f.sor)+',\''+esc(String(f.azonosito||''))+'\')">KÉSZ</button>';return '<div class="trip '+(newr?'new ':'')+(mine?'mine':'')+'"><div class="route">'+esc(f.indulas)+' → '+esc(f.cel)+'</div><div class="meta">'+esc(f.datum)+' '+esc(f.ido||'Minél hamarabb')+'<br>'+esc(f.nev||'')+' • '+esc(f.telefon||'')+'<br>Státusz: '+esc(f.statusz||'')+(f.sofor?'<br>Sofőr: '+esc(f.sofor):'')+(f.megjegyzes?'<br>Megjegyzés: '+esc(f.megjegyzes):'')+'</div><div class="actions"><a class="btn darkBtn" href="'+telLink(f.telefon)+'">HÍVÁS</a><a class="btn darkBtn" target="_blank" href="'+navLink(f.indulas)+'">NAVIGÁCIÓ</a>'+btn+'</div></div>'}).join('')}
async function betolt(){try{const v=await call('ujFuvarokLekerdezese',[TOKEN]);if(expired(v))return;if(Array.isArray(v))render(v);else if(v&&v.siker&&Array.isArray(v.lista))render(v.lista);else if(Array.isArray(v?.fuvarok))render(v.fuvarok);else render(v)}catch(e){document.getElementById('lista').innerHTML='<div class="empty">Kapcsolati hiba.</div>'}}
function gpsStop(){if(gpsWatch!==null&&navigator.geolocation)navigator.geolocation.clearWatch(gpsWatch);if(gpsTimer)clearInterval(gpsTimer);gpsWatch=null;gpsTimer=null;gpsTrip='';lastPos=null;gpsKuldesFolyamatban=false;document.getElementById('gps').textContent='GPS: nincs aktív fuvar'}function gpsSend(){if(!gpsTrip||!lastPos||gpsKuldesFolyamatban)return;gpsKuldesFolyamatban=true;call('soforAppHelyzetFrissites',[TOKEN,gpsTrip,lastPos.lat,lastPos.lng]).then(v=>{if(v&&v.siker)document.getElementById('gps').textContent='🟢 GPS aktív – utolsó küldés: '+new Date().toLocaleTimeString('hu-HU')}).finally(()=>{gpsKuldesFolyamatban=false})}function gpsStart(id,pos){gpsStop();gpsTrip=id;if(pos)lastPos={lat:pos.coords.latitude,lng:pos.coords.longitude};document.getElementById('gps').textContent='🟢 GPS helyzetmegosztás aktív';if(navigator.geolocation){gpsWatch=navigator.geolocation.watchPosition(p=>{lastPos={lat:p.coords.latitude,lng:p.coords.longitude};gpsSend()},()=>{}, {enableHighAccuracy:true,maximumAge:1000,timeout:10000})}gpsSend();gpsTimer=setInterval(gpsSend,3000)}
function elfogad(sor,id){const go=pos=>call('fuvarElvallalasa',[sor,TOKEN]).then(v=>{if(!v||!v.siker){alert(v?.uzenet||'Nem sikerült elvállalni.');return}gpsStart(id,pos);betolt()});if(navigator.geolocation)navigator.geolocation.getCurrentPosition(go,()=>go(null),{enableHighAccuracy:true,timeout:12000});else go(null)}async function kesz(sor,id){const v=await call('fuvarKesz',[sor,TOKEN]);if(!v||!v.siker){alert(v?.uzenet||'Nem sikerült lezárni.');return}if(gpsTrip===id)gpsStop();betolt()}
function cimekMutatasa(cimek){const lista=Array.isArray(cimek)?cimek:[];const make=(target,field)=>{const d=document.getElementById(target);d.innerHTML=lista.slice(0,6).map(x=>'<button type="button" class="chip" data-cim="'+esc(x.cim||'')+'">'+esc(x.cim||'')+(x.alkalom>1?' ('+x.alkalom+'×)':'')+'</button>').join('');d.querySelectorAll('.chip').forEach(b=>b.onclick=()=>document.getElementById(field).value=b.dataset.cim||'')};make('indulasCimek','find');make('celCimek','fcel')}
function ugyfelValaszt(u){kivalasztottUgyfel=u;document.getElementById('fnev').value=u.nev||'';document.getElementById('ftel').value=u.telefon||'';document.getElementById('femail').value=u.email||'';document.getElementById('ugyfelKeres').value=(u.nev||'')+(u.telefon?' – '+u.telefon:'');document.getElementById('ugyfelJavaslatok').classList.remove('open');cimekMutatasa(u.cimek||[])}
async function ugyfelKereses(){const q=document.getElementById('ugyfelKeres').value.trim(),box=document.getElementById('ugyfelJavaslatok');if(q.length<2){box.classList.remove('open');box.innerHTML='';return}const kulcs=q.toLowerCase();try{let l=ugyfelCache[kulcs];if(!l){const v=await call('soforUgyfelJavaslatok',[TOKEN,q]);if(expired(v))return;l=v&&v.siker&&Array.isArray(v.lista)?v.lista:[];ugyfelCache[kulcs]=l}if(!l.length){box.innerHTML='<div class="sug"><small>Nincs korábbi találat.</small></div>';box.classList.add('open');return}box.innerHTML=l.map((u,i)=>'<div class="sug" data-i="'+i+'"><b>'+esc(u.nev||'Névtelen')+'</b><small>'+esc(u.telefon||'')+(u.utak?' • '+u.utak+' korábbi fuvar':'')+'</small></div>').join('');box.classList.add('open');box.querySelectorAll('.sug[data-i]').forEach(el=>el.onclick=()=>ugyfelValaszt(l[Number(el.dataset.i)]))}catch(e){box.classList.remove('open')}}
document.getElementById('ugyfelKeres').addEventListener('input',()=>{clearTimeout(ugyfelTimer);ugyfelTimer=setTimeout(ugyfelKereses,280)});document.addEventListener('click',e=>{if(!e.target.closest('.searchWrap'))document.getElementById('ugyfelJavaslatok').classList.remove('open')});
function uritForm(){['ugyfelKeres','fnev','ftel','femail','find','fcel','fido','fmegj'].forEach(id=>document.getElementById(id).value='');document.getElementById('futas').value='1';document.getElementById('indulasCimek').innerHTML='';document.getElementById('celCimek').innerHTML='';kivalasztottUgyfel=null;idoMod('azonnali')}
async function fuvarHozzaad(){const a={nev:fnev.value.trim(),telefon:ftel.value.trim(),email:femail.value.trim(),indulas:find.value.trim(),cel:fcel.value.trim(),rendelesTipus:rendelesTipus,datum:rendelesTipus==='idopont'?fdatum.value:'',ido:rendelesTipus==='idopont'?fido.value:'',utasok:futas.value,megjegyzes:fmegj.value.trim()};const m=document.getElementById('formMsg'),g=document.getElementById('mentesBtn');if(!a.nev||!a.telefon||!a.indulas||!a.cel){m.className='errmsg';m.textContent='Töltsd ki a nevet, telefonszámot, indulást és célt.';return}if(rendelesTipus==='idopont'&&(!a.datum||!a.ido)){m.className='errmsg';m.textContent='Időpontra kérésnél add meg a dátumot és az időt.';return}g.disabled=true;g.textContent='MENTÉS...';m.className='muted';m.textContent='';try{const v=await call('soforFuvarHozzaadas',[TOKEN,a]);if(expired(v))return;m.className=v&&v.siker?'okmsg':'errmsg';m.textContent=v?.uzenet||'';if(v&&v.siker){uritForm();setTimeout(()=>document.getElementById('form').classList.remove('open'),900);betolt()}}catch(e){m.className='errmsg';m.textContent='Kapcsolati hiba. Próbáld újra!'}finally{g.disabled=false;g.textContent='MENTÉS'}}
async function kezdoBetolt(){try{const mentett=sessionStorage.getItem('soforKezdoCache');if(mentett){const c=JSON.parse(mentett);if(c.munka)munkaKirajzol(c.munka);if(c.fuvarok){if(Array.isArray(c.fuvarok))render(c.fuvarok);else if(Array.isArray(c.fuvarok.lista))render(c.fuvarok.lista);else if(Array.isArray(c.fuvarok.fuvarok))render(c.fuvarok.fuvarok)}}}catch(e){}try{const v=await call('soforKezdoAdatok',[]);if(expired(v)||!v||!v.siker)return;munkaKirajzol(v.munka);const f=v.fuvarok;if(Array.isArray(f))render(f);else if(f&&Array.isArray(f.lista))render(f.lista);else if(f&&Array.isArray(f.fuvarok))render(f.fuvarok);try{sessionStorage.setItem('soforKezdoCache',JSON.stringify({munka:v.munka,fuvarok:v.fuvarok}))}catch(e){}}catch(e){await Promise.allSettled([munkaBetolt(),betolt()])}}
async function logout(){try{await call('soforKijelentkezes',[TOKEN])}catch(e){}gpsStop();localStorage.removeItem('soforToken');localStorage.removeItem('soforNev');location.replace('/sofor/')}
kezdoBetolt();setInterval(betolt,10000);window.addEventListener('beforeunload',()=>{if(gpsWatch!==null&&navigator.geolocation)navigator.geolocation.clearWatch(gpsWatch);if(gpsTimer)clearInterval(gpsTimer)});
</script>
</body></html>
