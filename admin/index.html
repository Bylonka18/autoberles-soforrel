<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b12"><title>Admin belépés – Autóbérlés sofőrrel</title>
<style>*{box-sizing:border-box}body{margin:0;background:#060a10;color:#f4f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.wrap{width:min(520px,calc(100% - 20px));margin:auto;padding:35px 0}.card{background:linear-gradient(180deg,#111b2a,#0c141f);border:1px solid #d7aa17;border-radius:18px;padding:20px}.yellow{color:#ffc400}.muted{color:#91a0b5;line-height:1.5}.btn{border:0;border-radius:11px;padding:13px 14px;font-weight:900;cursor:pointer;text-decoration:none;text-align:center}.yellowBtn{background:#ffc400;color:#111827}.darkBtn{background:#26354e;color:#fff}label{display:block;margin:16px 0 6px;font-weight:800}input{width:100%;border:1px solid #34435b;border-radius:11px;background:#09111d;color:#fff;padding:13px;font-size:16px}.msg{margin-top:12px;font-weight:800}.err{color:#ff9b9b}.ok{color:#79e6a4}</style></head>
<body><main class="wrap"><section class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><b class="yellow">ADMIN</b><div class="muted">Biztonságos emailes belépés</div></div><a class="btn darkBtn" href="/">Főoldal</a></div><label>Email cím</label><input id="email" type="email" autocomplete="email" value="tokai95@icloud.com"><button id="loginBtn" class="btn yellowBtn" style="width:100%;margin-top:14px">BELÉPÉSI LINK KÉRÉSE</button><p class="muted">A belépési linket emailben küldjük el. Jelszó nem szükséges.</p><div id="msg" class="msg"></div></section></main>
<script>
const SB_URL='https://zmqfmxcysugdavmmksky.supabase.co',SB_KEY='sb_publishable_EUCrm17dIJGOTQWAO_hR4w_GLlxbPDr',API=SB_URL+'/functions/v1/web-api';
function hashToken(){const h=new URLSearchParams(location.hash.slice(1));return h.get('access_token')||''}
async function verify(token){const q=new URLSearchParams({muvelet:'webHivas',nev:'adminFelhasznaloLista',args:encodeURIComponent('[]'),sessionToken:token});const r=await fetch(API+'?'+q);return await r.json()}
async function finish(){const token=hashToken()||localStorage.getItem('adminToken')||'';if(!token)return;msg.textContent='Belépés ellenőrzése...';const v=await verify(token);if(v&&v.siker){localStorage.setItem('adminToken',token);history.replaceState(null,'',location.pathname);location.replace('/admin/panel/')}else{localStorage.removeItem('adminToken');msg.className='msg err';msg.textContent='Ez az email cím nem rendelkezik admin jogosultsággal.'}}
loginBtn.onclick=async()=>{const e=email.value.trim().toLowerCase();if(!e){msg.className='msg err';msg.textContent='Add meg az email címedet!';return}loginBtn.disabled=true;msg.className='msg';msg.textContent='Email küldése...';try{const r=await fetch(SB_URL+'/auth/v1/otp',{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY},body:JSON.stringify({email:e,options:{emailRedirectTo:location.origin+'/admin/'}})});if(!r.ok)throw new Error();msg.className='msg ok';msg.textContent='A belépési linket elküldtük. Nyisd meg az emailedet!'}catch{msg.className='msg err';msg.textContent='Nem sikerült elküldeni az emailt.'}finally{loginBtn.disabled=false}};
finish();
</script></body></html>
