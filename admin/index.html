<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b12"><title>Admin belépés – Autóbérlés sofőrrel</title><style>*{box-sizing:border-box}body{margin:0;background:#060a10;color:#f4f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.wrap{width:min(520px,calc(100% - 20px));margin:auto;padding:35px 0}.card{background:linear-gradient(180deg,#111b2a,#0c141f);border:1px solid #d7aa17;border-radius:18px;padding:20px}.yellow{color:#ffc400}.muted{color:#91a0b5}.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:900;cursor:pointer;text-decoration:none;text-align:center}.yellowBtn{background:#ffc400;color:#111827}.darkBtn{background:#26354e;color:#fff}label{display:block;margin:12px 0 5px;font-weight:800}input{width:100%;border:1px solid #34435b;border-radius:11px;background:#09111d;color:#fff;padding:12px;font-size:16px}.msg{margin-top:12px;font-weight:800}.err{color:#ff9b9b}</style></head><body><main class="wrap"><section class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><b class="yellow">ADMIN</b><div class="muted">Adminisztrátori belépés</div></div><a class="btn darkBtn" href="/">Főoldal</a></div><label>Felhasználónév</label><input id="user" autocomplete="username"><label>Jelszó</label><input id="pass" type="password" autocomplete="current-password"><button id="loginBtn" class="btn yellowBtn" style="width:100%;margin-top:14px">BELÉPÉS</button><div id="msg" class="msg"></div></section></main><script>
const API='https://zmqfmxcysugdavmmksky.supabase.co/functions/v1/web-api';async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function login(){const u=user.value.trim(),p=pass.value;if(!u||!p){msg.className='msg err';msg.textContent='Add meg a felhasználónevet és a jelszót!';return}loginBtn.disabled=true;msg.textContent='Belépés...';try{const q=new URLSearchParams({muvelet:'adminBelepesHash',felhasznalo:u,jelszoHash:await hash(p)}),r=await fetch(API+'?'+q),v=await r.json();if(v.siker){localStorage.setItem('adminToken',v.token);location.replace('/admin/panel/');return}msg.className='msg err';msg.textContent=v.uzenet||'Hibás felhasználónév vagy jelszó.'}catch{msg.className='msg err';msg.textContent='Kapcsolati hiba.'}finally{loginBtn.disabled=false}}loginBtn.onclick=login;pass.onkeydown=e=>{if(e.key==='Enter')login()};if(localStorage.getItem('adminToken'))location.replace('/admin/panel/');
</script></body></html>
