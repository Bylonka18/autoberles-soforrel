<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b12"><title>Pontkezelés – Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#060a10;color:#f4f7fb;font-family:Inter,system-ui,Arial}.wrap{width:min(850px,calc(100% - 20px));margin:auto;padding:18px 0}.card,.item{background:linear-gradient(180deg,#111b2a,#0c141f);border:1px solid #26344a;border-radius:16px;padding:16px;margin-bottom:12px}.head{border-color:#d7aa17}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.yellow{color:#ffc400}.muted{color:#91a0b5}.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:900;cursor:pointer;text-decoration:none}.dark{background:#26354e;color:#fff}.green{background:#2ecc71;color:#07162e}input{width:100%;border:1px solid #34435b;border-radius:10px;background:#09111d;color:#fff;padding:11px;font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.points{font-size:24px;font-weight:950;color:#ffc400}.empty{text-align:center;color:#91a0b5;padding:20px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card head"><div class="row"><div><b class="yellow">REGISZTRÁLT FELHASZNÁLÓK / PONTOK</b><div class="muted">Admin pontkezelés</div></div><div><a class="btn dark" href="/admin/panel/">← Admin panel</a></div></div></section><section class="card"><div class="row"><b>Felhasználók</b><button class="btn dark" onclick="betolt()">Frissítés</button></div><div id="lista"><div class="empty">Betöltés...</div></div></section></main><script>const API='https://script.google.com/macros/s/AKfycbz_9Rzy2acFm9sOKGJfvghOSt1TO3SCukRd3XJ5j3-YwdqkovGpwflaln63gAEWu74W/exec',TOKEN=localStorage.getItem('adminToken')||'';if(!TOKEN)location.replace('/admin/');function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function jsonp(n,a=[]){return new Promise((resolve,reject)=>{const cb='__p'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script'),q=new URLSearchParams({api:'1',muvelet:'webHivas',callback:cb,nev:n,args:encodeURIComponent(JSON.stringify(a)),sessionToken:TOKEN});const t=setTimeout(()=>{clean();reject()},30000);function clean(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=d=>{clean();resolve(d)};s.onerror=()=>{clean();reject()};s.src=API+'?'+q;document.body.appendChild(s)})}async function betolt(){try{const v=await jsonp('adminFelhasznaloLista');if(v&&!v.siker&&/lejárt/i.test(v.uzenet||'')){localStorage.removeItem('adminToken');location.replace('/admin/');return}const a=v?.lista||[];lista.innerHTML=a.length?a.map((u,i)=>'<div class="item"><b>'+esc(u.nev)+'</b><div class="muted">'+esc(u.email)+' • '+esc(u.telefon)+'</div><div>Szint: <b>'+esc(u.szint)+'</b> • Teljesített fuvar: '+Number(u.teljesitettFuvar||0)+'</div><div class="points">'+Number(u.pont||0)+' pont</div><div class="grid" style="margin-top:10px"><input id="p'+i+'" type="number" placeholder="+100 vagy -100"><input id="m'+i+'" placeholder="Megjegyzés"></div><button class="btn green" style="width:100%;margin-top:8px" onclick="mod('+i+',\''+esc(u.email)+'\')">PONT MÓDOSÍTÁSA</button></div>').join(''):'<div class="empty">Még nincs regisztrált felhasználó.</div>'}catch(e){lista.innerHTML='<div class="empty">Kapcsolati hiba.</div>'}}async function mod(i,email){const p=Math.floor(Number(document.getElementById('p'+i).value||0)),m=document.getElementById('m'+i).value.trim();if(!p)return alert('Adj meg pontot!');if(!confirm('Biztosan módosítod '+email+' egyenlegét '+(p>0?'+':'')+p+' ponttal?'))return;const v=await jsonp('adminFelhasznaloPont',[email,p,m]);alert(v?.siker?'Sikeres. Új egyenleg: '+v.pont+' pont':(v?.uzenet||'Nem sikerült.'));if(v?.siker)betolt()}betolt();</script></body></html>
