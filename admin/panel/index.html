<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b12"><title>Admin panel – Autóbérlés sofőrrel</title><style>
*{box-sizing:border-box}body{margin:0;background:#060a10;color:#f4f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.wrap{width:min(1050px,calc(100% - 20px));margin:auto;padding:14px 0 50px}.head,.card{background:linear-gradient(180deg,#111b2a,#0c141f);border:1px solid #26344a;border-radius:18px;padding:16px;margin-bottom:13px}.head{border-color:#d7aa17}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.yellow{color:#ffc400}.muted{color:#91a0b5}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}.yellowBtn{background:#ffc400;color:#111827}.darkBtn{background:#26354e;color:#fff}.redBtn{background:#4a1720;color:#ffb0b8}.greenBtn{background:#2ecc71;color:#07162e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{background:#0a111c;border:1px solid #304059;border-radius:14px;padding:13px;margin-top:9px}.meta{color:#b7c2d0;line-height:1.5;font-size:14px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}label{display:block;margin:9px 0 5px;font-weight:800}input,select,textarea{width:100%;border:1px solid #34435b;border-radius:10px;background:#09111d;color:#fff;padding:11px;font-size:15px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.empty{text-align:center;color:#91a0b5;padding:20px}.stars{color:#ffc400}.status{padding:12px;border-radius:12px;background:#101a2a;border:1px solid #32445f}.toplinks{display:flex;gap:8px}.toplinks a{text-decoration:none}@media(max-width:760px){.grid,.formgrid{grid-template-columns:1fr}.wrap{width:min(100% - 14px,1050px)}}
</style></head><body><main class="wrap"><section class="head"><div class="row"><div><b class="yellow">ADMIN PANEL</b><div class="muted">Autóbérlés sofőrrel – Kiskőrös</div></div><div class="toplinks"><a class="btn darkBtn" href="/">Főoldal</a><button class="btn redBtn" onclick="logout()">Kijelentkezés</button></div></div><div id="online" class="status" style="margin-top:12px">Online rendelés: betöltés...</div><button id="onlineBtn" class="btn yellowBtn" style="width:100%;margin-top:8px" onclick="onlineValtas()">ONLINE RENDELÉS VÁLTÁSA</button></section>
<div class="grid"><section class="card"><div class="row"><b>Sofőrök</b><button class="btn darkBtn" onclick="soforok()">Frissítés</button></div><div id="soforLista"></div><hr style="border-color:#26344a;margin:16px 0"><b>Új sofőr</b><div class="formgrid"><div><label>Név</label><input id="sn"></div><div><label>Felhasználónév</label><input id="su"></div><div><label>Jelszó</label><input id="sp" type="password"></div><div><label>Email</label><input id="se" type="email"></div><div><label>Autó</label><input id="sa"></div><div><label>Szín</label><input id="ss"></div><div><label>Rendszám</label><input id="sr"></div></div><button class="btn greenBtn" style="width:100%;margin-top:10px" onclick="soforUj()">SOFŐR HOZZÁADÁSA</button></section>
<section class="card"><div class="row"><b>Fuvarok</b><button class="btn darkBtn" onclick="fuvarok()">Frissítés</button></div><div id="fuvarLista"></div></section></div>
<div class="grid"><section class="card"><div class="row"><b>Értékelések</b><button class="btn darkBtn" onclick="ertekelesek()">Frissítés</button></div><div id="ertekelesLista"></div></section><section class="card"><b>Tiltólista</b><div class="formgrid"><div><label>Típus</label><select id="tt"><option value="telefon">Telefonszám</option><option value="email">Email</option></select></div><div><label>Érték</label><input id="te"></div></div><button class="btn redBtn" style="width:100%;margin-top:10px" onclick="tilt()">TILTÁS</button><div id="tiltoLista"></div></section></div></main>
<script>
const API='https://script.google.com/macros/s/AKfycbz_9Rzy2acFm9sOKGJfvghOSt1TO3SCukRd3XJ5j3-YwdqkovGpwflaln63gAEWu74W/exec';const TOKEN=localStorage.getItem('adminToken')||'';if(!TOKEN)location.replace('/admin/');function jsonp(m,p={},timeout=25000){return new Promise((resolve,reject)=>{const cb='__a_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),q=new URLSearchParams({api:'1',muvelet:m,callback:cb});Object.entries(p).forEach(([k,v])=>q.set(k,String(v)));const t=setTimeout(()=>{clean();reject(new Error('timeout'))},timeout);function clean(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=d=>{clean();resolve(d)};s.onerror=()=>{clean();reject(new Error('net'))};s.src=API+'?'+q.toString();document.body.appendChild(s)})}function call(nev,args=[]){return jsonp('webHivas',{nev,args:encodeURIComponent(JSON.stringify(args)),sessionToken:TOKEN},30000)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function expired(v){if(v&&!v.siker&&/lejárt|munkamenet/i.test(v.uzenet||'')){localStorage.removeItem('adminToken');location.replace('/admin/');return true}return false}
async function onlineBetolt(){const v=await call('onlineRendelesAllapot',[]);if(expired(v))return;const on=v===true||(v&&v.online===true);document.getElementById('online').textContent=on?'🟢 Online rendelés BEKAPCSOLVA':'🔴 Online rendelés KIKAPCSOLVA'}async function onlineValtas(){const v=await call('onlineRendelesValtas',[]);if(expired(v))return;onlineBetolt()}
async function soforok(){const v=await call('adminSoforListaLekerdezese',[]);if(expired(v))return;const lista=Array.isArray(v)?v:(v?.lista||[]),d=document.getElementById('soforLista');if(!lista.length){d.innerHTML='<div class="empty">Nincs sofőr.</div>';return}d.innerHTML=lista.map(s=>'<div class="item"><b>'+esc(s.nev||s.felhasznalo)+'</b><div class="meta">@'+esc(s.felhasznalo||'')+'<br>'+esc(s.email||'')+'<br>'+(s.dolgozik?'🟢 Dolgozik':'⚫ Nem dolgozik')+'<br>'+esc([s.autoSzin,s.autoTipus,s.rendszam].filter(Boolean).join(' • '))+'</div><div class="actions"><button class="btn yellowBtn" onclick="soforValt(\''+esc(s.felhasznalo)+'\')">Állapot</button><button class="btn darkBtn" onclick="jarmu(\''+esc(s.felhasznalo)+'\')">Jármű</button><button class="btn redBtn" onclick="soforTorol(\''+esc(s.felhasznalo)+'\')">Törlés</button></div></div>').join('')}
async function soforValt(u){const v=await call('adminSoforDolgozikValtas',[u]);if(!v||v.siker===false)alert(v?.uzenet||'Hiba');soforok()}async function soforTorol(u){if(!confirm('Biztosan törlöd ezt a sofőrt?'))return;const v=await call('adminSoforTorlese',[u,TOKEN]);alert(v?.uzenet||'Kész');soforok()}async function jarmu(u){const auto=prompt('Autó típusa:');if(auto===null)return;const szin=prompt('Szín:')||'';const rendszam=prompt('Rendszám:')||'';const v=await call('adminSoforJarmuMentese',[u,auto,szin,rendszam,TOKEN]);alert(v?.uzenet||'Kész');soforok()}async function soforUj(){const a=[sn.value.trim(),su.value.trim(),sp.value,se.value.trim(),sa.value.trim(),ss.value.trim(),sr.value.trim()];if(!a[0]||!a[1]||!a[2]||!a[3]){alert('Név, felhasználónév, jelszó és email kötelező.');return}const v=await call('adminSoforLetrehozasa',a);alert(v?.uzenet||'Kész');if(v&&v.siker){sn.value=su.value=sp.value=se.value=sa.value=ss.value=sr.value='';soforok()}}
async function fuvarok(){const v=await call('adminFuvarokLekerdezese',[]);if(expired(v))return;const lista=Array.isArray(v)?v:(v?.lista||[]),d=document.getElementById('fuvarLista');if(!lista.length){d.innerHTML='<div class="empty">Nincs rögzített fuvar.</div>';return}d.innerHTML=lista.slice(0,80).map(f=>'<div class="item"><b>'+esc(f.indulas)+' → '+esc(f.cel)+'</b><div class="meta">'+esc(f.datum)+' '+esc(f.ido||'Minél hamarabb')+'<br>'+esc(f.nev||'')+' • '+esc(f.telefon||'')+'<br>Státusz: '+esc(f.statusz||'')+(f.sofor?'<br>Sofőr: '+esc(f.sofor):'')+'</div><div class="actions"><button class="btn redBtn" onclick="fuvarTorol('+Number(f.sor)+')">Törlés</button></div></div>').join('')}async function fuvarTorol(sor){if(!confirm('Biztosan törlöd a fuvart?'))return;const v=await call('adminFuvarTorlese',[sor]);alert(v?.uzenet||'Kész');fuvarok()}
async function ertekelesek(){const v=await call('adminErtekelesLista',[TOKEN]);if(expired(v))return;const lista=Array.isArray(v)?v:(v?.lista||[]),d=document.getElementById('ertekelesLista');if(!lista.length){d.innerHTML='<div class="empty">Nincs értékelés.</div>';return}d.innerHTML=lista.map(e=>'<div class="item"><div class="stars">'+('★'.repeat(Number(e.csillag||0)))+'</div><b>'+esc(e.nev||'Névtelen')+'</b><div class="meta">'+esc(e.datum||'')+'<br>'+esc(e.velemeny||'')+'<br>'+(e.jovahagyva?'✅ Jóváhagyva':'⏳ Nincs jóváhagyva')+'</div><div class="actions"><button class="btn greenBtn" onclick="ertekAll('+Number(e.sor)+',true)">Jóváhagy</button><button class="btn darkBtn" onclick="ertekAll('+Number(e.sor)+',false)">Visszavon</button><button class="btn redBtn" onclick="ertekTorol('+Number(e.sor)+')">Törlés</button></div></div>').join('')}async function ertekAll(s,b){const v=await call('adminErtekelesAllapot',[s,b,TOKEN]);if(!v||v.siker===false)alert(v?.uzenet||'Hiba');ertekelesek()}async function ertekTorol(s){if(!confirm('Törlöd az értékelést?'))return;const v=await call('adminErtekelesTorles',[s,TOKEN]);if(!v||v.siker===false)alert(v?.uzenet||'Hiba');ertekelesek()}
async function tiltolista(){const v=await call('adminTiltolistaLekerdezese',[TOKEN]);if(expired(v))return;const lista=Array.isArray(v)?v:(v?.lista||[]),d=document.getElementById('tiltoLista');if(!lista.length){d.innerHTML='<div class="empty">A tiltólista üres.</div>';return}d.innerHTML=lista.map(e=>'<div class="item"><b>'+esc(e.tipus)+'</b><div class="meta">'+esc(e.ertek)+'</div><button class="btn darkBtn" style="margin-top:8px" onclick="felold(\''+esc(e.id)+'\')">Feloldás</button></div>').join('')}async function tilt(){const v=await call('adminUgyfelTiltasa',[{tipus:tt.value,ertek:te.value.trim()},TOKEN]);alert(v?.uzenet||'Kész');te.value='';tiltolista()}async function felold(id){const v=await call('adminTiltoFeloldasa',[id,TOKEN]);alert(v?.uzenet||'Kész');tiltolista()}function logout(){localStorage.removeItem('adminToken');location.replace('/admin/')}
onlineBetolt();soforok();fuvarok();ertekelesek();tiltolista();
</script></body></html>
