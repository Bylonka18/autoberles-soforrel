<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b12"><title>Admin panel – Autóbérlés sofőrrel</title><style>
*{box-sizing:border-box}body{margin:0;background:#060a10;color:#f4f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.wrap{width:min(1050px,calc(100% - 20px));margin:auto;padding:14px 0 50px}.head,.card{background:linear-gradient(180deg,#111b2a,#0c141f);border:1px solid #26344a;border-radius:18px;padding:16px;margin-bottom:13px}.head{border-color:#d7aa17}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.yellow{color:#ffc400}.muted{color:#91a0b5}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}.yellowBtn{background:#ffc400;color:#111827}.darkBtn{background:#26354e;color:#fff}.redBtn{background:#4a1720;color:#ffb0b8}.greenBtn{background:#2ecc71;color:#07162e}.btn:disabled{opacity:.55;cursor:wait}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{background:#0a111c;border:1px solid #304059;border-radius:14px;padding:13px;margin-top:9px}.meta{color:#b7c2d0;line-height:1.5;font-size:14px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}label{display:block;margin:9px 0 5px;font-weight:800}input,select,textarea{width:100%;border:1px solid #34435b;border-radius:10px;background:#09111d;color:#fff;padding:11px;font-size:15px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.empty{text-align:center;color:#91a0b5;padding:20px}.stars{color:#ffc400}.status{padding:12px;border-radius:12px;background:#101a2a;border:1px solid #32445f}.toplinks{display:flex;gap:8px}.toplinks a{text-decoration:none}.miniLoad{opacity:.65}.flash{transition:opacity .2s}.flash.loading{opacity:.55}@media(max-width:760px){.grid,.formgrid{grid-template-columns:1fr}.wrap{width:min(100% - 14px,1050px)}}
</style></head><body><main class="wrap"><section class="head"><div class="row"><div><b class="yellow">ADMIN PANEL</b><div class="muted">Autóbérlés sofőrrel – Kiskőrös</div></div><div class="toplinks"><a class="btn darkBtn" href="/">Főoldal</a><button class="btn redBtn" onclick="logout()">Kijelentkezés</button></div></div><div id="online" class="status" style="margin-top:12px">Online rendelés: betöltés...</div><button id="onlineBtn" class="btn yellowBtn" style="width:100%;margin-top:8px" onclick="onlineValtas()">ONLINE RENDELÉS VÁLTÁSA</button></section>
<div class="grid"><section class="card"><div class="row"><b>Sofőrök</b><button class="btn darkBtn" onclick="soforok(this)">Frissítés</button></div><div id="soforLista"><div class="empty">Betöltés...</div></div><hr style="border-color:#26344a;margin:16px 0"><b>Új sofőr</b><div class="formgrid"><div><label>Név</label><input id="sn"></div><div><label>Felhasználónév</label><input id="su"></div><div><label>Jelszó</label><input id="sp" type="password"></div><div><label>Email</label><input id="se" type="email"></div><div><label>Autó</label><input id="sa"></div><div><label>Szín</label><input id="ss"></div><div><label>Rendszám</label><input id="sr"></div></div><button class="btn greenBtn" style="width:100%;margin-top:10px" onclick="soforUj(this)">SOFŐR HOZZÁADÁSA</button></section>
<section class="card"><div class="row"><b>Fuvarok</b><button class="btn darkBtn" onclick="fuvarok(this)">Frissítés</button></div><div id="fuvarLista"><div class="empty">Betöltés...</div></div></section></div>
<div class="grid"><section class="card"><div class="row"><b>Értékelések</b><button class="btn darkBtn" onclick="ertekelesek(this)">Frissítés</button></div><div id="ertekelesLista"><div class="empty">Betöltés...</div></div></section><section class="card"><b>Tiltólista</b><div class="formgrid"><div><label>Típus</label><select id="tt"><option value="telefon">Telefonszám</option><option value="email">Email</option></select></div><div><label>Érték</label><input id="te"></div></div><button class="btn redBtn" style="width:100%;margin-top:10px" onclick="tilt(this)">TILTÁS</button><div id="tiltoLista"><div class="empty">Betöltés...</div></div></section></div></main>
<script>
const API='https://script.google.com/macros/s/AKfycbz_9Rzy2acFm9sOKGJfvghOSt1TO3SCukRd3XJ5j3-YwdqkovGpwflaln63gAEWu74W/exec';const TOKEN=localStorage.getItem('adminToken')||'';if(!TOKEN)location.replace('/admin/');
function jsonp(m,p={},timeout=25000){return new Promise((resolve,reject)=>{const cb='__a_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),q=new URLSearchParams({api:'1',muvelet:m,callback:cb});Object.entries(p).forEach(([k,v])=>q.set(k,String(v)));const t=setTimeout(()=>{clean();reject(new Error('timeout'))},timeout);function clean(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=d=>{clean();resolve(d)};s.onerror=()=>{clean();reject(new Error('net'))};s.src=API+'?'+q.toString();document.body.appendChild(s)})}
function call(nev,args=[]){return jsonp('webHivas',{nev,args:encodeURIComponent(JSON.stringify(args)),sessionToken:TOKEN},30000)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function expired(v){if(v&&!v.siker&&/lejárt|munkamenet/i.test(v.uzenet||'')){localStorage.removeItem('adminToken');location.replace('/admin/');return true}return false}function busy(b,on,txt){if(!b)return;if(on){b.dataset.old=b.textContent;b.disabled=true;b.textContent=txt||'BETÖLTÉS...'}else{b.disabled=false;b.textContent=b.dataset.old||b.textContent}}
function onlineRender(on){document.getElementById('online').textContent=on?'🟢 Online rendelés BEKAPCSOLVA':'🔴 Online rendelés KIKAPCSOLVA'}
function soforRender(lista){lista=Array.isArray(lista)?lista:[];const d=document.getElementById('soforLista');if(!lista.length){d.innerHTML='<div class="empty">Nincs sofőr.</div>';return}d.innerHTML=lista.map(s=>'<div class="item"><b>'+esc(s.nev||s.felhasznalo)+'</b><div class="meta">@'+esc(s.felhasznalo||'')+'<br>'+esc(s.email||'')+'<br>'+(s.dolgozik?'🟢 Dolgozik':'⚫ Nem dolgozik')+'<br>'+esc([s.autoSzin,s.autoTipus,s.rendszam].filter(Boolean).join(' • '))+'</div><div class="actions"><button class="btn yellowBtn" onclick="soforValt(\''+esc(s.felhasznalo)+'\')">Állapot</button><button class="btn darkBtn" onclick="jarmu(\''+esc(s.felhasznalo)+'\')">Jármű</button><button class="btn redBtn" onclick="soforTorol(\''+esc(s.felhasznalo)+'\')">Törlés</button></div></div>').join('')}
function fuvarRender(lista){lista=Array.isArray(lista)?lista:[];const d=document.getElementById('fuvarLista');if(!lista.length){d.innerHTML='<div class="empty">Nincs aktív fuvar.</div>';return}d.innerHTML=lista.slice(0,80).map(f=>'<div class="item"><b>'+esc(f.indulas)+' → '+esc(f.cel)+'</b><div class="meta">'+esc(f.datum)+' '+esc(f.ido||'Minél hamarabb')+'<br>'+esc(f.nev||'')+' • '+esc(f.telefon||'')+'<br>Státusz: '+esc(f.statusz||'')+(f.sofor?'<br>Sofőr: '+esc(f.sofor):'')+'</div><div class="actions"><button class="btn redBtn" onclick="fuvarTorol('+Number(f.sor)+')">Törlés</button></div></div>').join('')}
function ertekRender(lista){lista=Array.isArray(lista)?lista:[];const d=document.getElementById('ertekelesLista');if(!lista.length){d.innerHTML='<div class="empty">Nincs értékelés.</div>';return}d.innerHTML=lista.map(e=>'<div class="item"><div class="stars">'+('★'.repeat(Number(e.csillag||0)))+'</div><b>'+esc(e.nev||'Névtelen')+'</b><div class="meta">'+esc(e.datum||'')+'<br>'+esc(e.velemeny||'')+'<br>'+(e.jovahagyva?'✅ Jóváhagyva':'⏳ Nincs jóváhagyva')+'</div><div class="actions"><button class="btn greenBtn" onclick="ertekAll('+Number(e.sor)+',true)">Jóváhagy</button><button class="btn darkBtn" onclick="ertekAll('+Number(e.sor)+',false)">Visszavon</button><button class="btn redBtn" onclick="ertekTorol('+Number(e.sor)+')">Törlés</button></div></div>').join('')}
function tiltoRender(lista){lista=Array.isArray(lista)?lista:[];const d=document.getElementById('tiltoLista');if(!lista.length){d.innerHTML='<div class="empty">A tiltólista üres.</div>';return}d.innerHTML=lista.map(e=>'<div class="item"><b>'+esc(e.tipus)+'</b><div class="meta">'+esc(e.ertek)+'</div><button class="btn darkBtn" style="margin-top:8px" onclick="felold(\''+esc(e.id)+'\')">Feloldás</button></div>').join('')}
function cacheMent(c){try{sessionStorage.setItem('adminGyorsCache',JSON.stringify(c))}catch(e){}}
function cacheBetolt(){try{const c=JSON.parse(sessionStorage.getItem('adminGyorsCache')||'null');if(!c)return;if(typeof c.online==='boolean')onlineRender(c.online);if(c.soforok)soforRender(c.soforok);if(c.fuvarok)fuvarRender(c.fuvarok);if(c.ertekelesek)ertekRender(c.ertekelesek);if(c.tiltottak)tiltoRender(c.tiltottak)}catch(e){}}
async function kezdo(){cacheBetolt();try{const v=await call('adminKezdoAdatok',[]);if(expired(v)||!v||!v.siker)throw new Error('fallback');onlineRender(!!v.online);soforRender(v.soforok);fuvarRender(v.fuvarok);ertekRender(v.ertekelesek);tiltoRender(v.tiltottak);cacheMent(v)}catch(e){Promise.allSettled([onlineBetolt(),soforok(),fuvarok(),ertekelesek(),tiltolista()])}}
async function onlineBetolt(){const v=await call('onlineRendelesAllapot',[]);if(expired(v))return;const on=v===true||(v&&v.online===true);onlineRender(on);return on}async function onlineValtas(){const b=document.getElementById('onlineBtn');busy(b,true,'MENTÉS...');try{const v=await call('onlineRendelesValtas',[]);if(expired(v))return;await onlineBetolt()}finally{busy(b,false)}}
async function soforok(b){busy(b,true);try{const v=await call('adminSoforListaLekerdezese',[]);if(expired(v))return;soforRender(Array.isArray(v)?v:(v?.lista||[]))}finally{busy(b,false)}}
async function fuvarok(b){busy(b,true);try{const v=await call('adminFuvarokLekerdezese',[]);if(expired(v))return;fuvarRender(Array.isArray(v)?v:(v?.lista||[]))}finally{busy(b,false)}}
async function ertekelesek(b){busy(b,true);try{const v=await call('adminErtekelesLista',[TOKEN]);if(expired(v))return;ertekRender(Array.isArray(v)?v:(v?.lista||[]))}finally{busy(b,false)}}
async function tiltolista(){const v=await call('adminTiltolistaLekerdezese',[TOKEN]);if(expired(v))return;tiltoRender(Array.isArray(v)?v:(v?.lista||[]))}
async function soforValt(u){const v=await call('adminSoforDolgozikValtas',[u]);if(!v||v.siker===false)alert(v?.uzenet||'Hiba');soforok()}async function soforTorol(u){if(!confirm('Biztosan törlöd ezt a sofőrt?'))return;const v=await call('adminSoforTorlese',[u,TOKEN]);alert(v?.uzenet||'Kész');soforok()}async function jarmu(u){const auto=prompt('Autó típusa:');if(auto===null)return;const szin=prompt('Szín:')||'';const rendszam=prompt('Rendszám:')||'';const v=await call('adminSoforJarmuMentese',[u,auto,szin,rendszam,TOKEN]);alert(v?.uzenet||'Kész');soforok()}async function soforUj(b){const a=[sn.value.trim(),su.value.trim(),sp.value,se.value.trim(),sa.value.trim(),ss.value.trim(),sr.value.trim()];if(!a[0]||!a[1]||!a[2]||!a[3]){alert('Név, felhasználónév, jelszó és email kötelező.');return}busy(b,true,'MENTÉS...');try{const v=await call('adminSoforLetrehozasa',a);alert(v?.uzenet||'Kész');if(v&&v.siker){sn.value=su.value=sp.value=se.value=sa.value=ss.value=sr.value='';soforok()}}finally{busy(b,false)}}
async function fuvarTorol(sor){if(!confirm('Biztosan törlöd a fuvart?'))return;const d=document.getElementById('fuvarLista');d.classList.add('miniLoad');try{const v=await call('adminFuvarTorlese',[sor]);if(!v||v.siker===false)alert(v?.uzenet||'Hiba');await fuvarok()}finally{d.classList.remove('miniLoad')}}
async function ertekAll(s,b){const v=await call('adminErtekelesAllapot',[s,b,TOKEN]);if(!v||v.siker===false)alert(v?.uzenet||'Hiba');ertekelesek()}async function ertekTorol(s){if(!confirm('Törlöd az értékelést?'))return;const v=await call('adminErtekelesTorles',[s,TOKEN]);if(!v||v.siker===false)alert(v?.uzenet||'Hiba');ertekelesek()}
async function tilt(b){if(!te.value.trim())return;busy(b,true,'MENTÉS...');try{const v=await call('adminUgyfelTiltasa',[{tipus:tt.value,ertek:te.value.trim()},TOKEN]);alert(v?.uzenet||'Kész');te.value='';tiltolista()}finally{busy(b,false)}}async function felold(id){const v=await call('adminTiltoFeloldasa',[id,TOKEN]);alert(v?.uzenet||'Kész');tiltolista()}function logout(){localStorage.removeItem('adminToken');sessionStorage.removeItem('adminGyorsCache');location.replace('/admin/')}
kezdo();
</script></body></html>
