<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b12"><title>Admin panel – Autóbérlés sofőrrel</title><style>*{box-sizing:border-box}body{margin:0;background:#060a10;color:#f4f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.wrap{width:min(1050px,calc(100% - 20px));margin:auto;padding:14px 0 50px}.head,.card{background:linear-gradient(180deg,#111b2a,#0c141f);border:1px solid #26344a;border-radius:18px;padding:16px;margin-bottom:13px}.head{border-color:#d7aa17}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.yellow{color:#ffc400}.muted{color:#91a0b5}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}.yellowBtn{background:#ffc400;color:#111827}.darkBtn{background:#26354e;color:#fff}.redBtn{background:#4a1720;color:#ffb0b8}.greenBtn{background:#2ecc71;color:#07162e}.btn:disabled{opacity:.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{background:#0a111c;border:1px solid #304059;border-radius:14px;padding:13px;margin-top:9px}.meta{color:#b7c2d0;line-height:1.5;font-size:14px}.driverCount{font-size:30px;font-weight:950;color:#ffc400}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{text-align:center;color:#91a0b5;padding:20px}.stars{color:#ffc400}.status{padding:12px;border-radius:12px;background:#101a2a;border:1px solid #32445f}.toplinks{display:flex;gap:8px}.toplinks a{text-decoration:none}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="head"><div class="row"><div><b class="yellow">ADMIN PANEL</b><div class="muted">Autóbérlés sofőrrel – Kiskőrös</div></div><div class="toplinks"><a class="btn darkBtn" href="/">Főoldal</a><button class="btn redBtn" onclick="logout()">Kijelentkezés</button></div></div><div id="online" class="status" style="margin-top:12px">Online rendelés: betöltés...</div><button class="btn yellowBtn" style="width:100%;margin-top:8px" onclick="onlineValtas()">ONLINE RENDELÉS VÁLTÁSA</button></section><div class="grid"><section class="card"><div class="row"><b>Sofőrök</b><button class="btn darkBtn" onclick="soforok()">Frissítés</button></div><div class="status" style="margin-top:10px"><span class="muted">Jelenleg dolgozó sofőrök:</span> <span id="driverCount" class="driverCount">–</span></div><div id="soforLista"><div class="empty">Betöltés...</div></div></section><section class="card"><div class="row"><b>Fuvarok</b><button class="btn darkBtn" onclick="fuvarok()">Frissítés</button></div><div id="fuvarLista"><div class="empty">Betöltés...</div></div></section></div><div class="grid"><section class="card"><div class="row"><b>Értékelések</b><button class="btn darkBtn" onclick="ertekelesek()">Frissítés</button></div><div id="ertekelesLista"><div class="empty">Betöltés...</div></div></section><section class="card"><div class="row"><b>Regisztrált felhasználók / Pontok</b><button class="btn darkBtn" onclick="felhasznalok()">Frissítés</button></div><div id="felhasznaloLista"><div class="empty">Betöltés...</div></div></section></div></main><script>const API='https://script.google.com/macros/s/AKfycbz_9Rzy2acFm9sOKGJfvghOSt1TO3SCukRd3XJ5j3-YwdqkovGpwflaln63gAEWu74W/exec';const TOKEN=localStorage.getItem('adminToken')||'';if(!TOKEN)location.replace('/fiok/');function jsonp(m,p={},timeout=25000){return new Promise((resolve,reject)=>{const cb='__a_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),q=new URLSearchParams({api:'1',muvelet:m,callback:cb});Object.entries(p).forEach(([k,v])=>q.set(k,String(v)));const t=setTimeout(()=>{clean();reject(new Error('timeout'))},timeout);function clean(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=d=>{clean();resolve(d)};s.onerror=()=>{clean();reject(new Error('net'))};s.src=API+'?'+q.toString();document.body.appendChild(s)})}function call(nev,args=[]){return jsonp('webHivas',{nev,args:encodeURIComponent(JSON.stringify(args)),sessionToken:TOKEN},30000)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function expired(v){if(v&&!v.siker&&/lejárt|munkamenet/i.test(v.uzenet||'')){localStorage.removeItem('adminToken');location.replace('/fiok/');return true}return false}function onlineRender(on){online.textContent=on?'🟢 Online rendelés BEKAPCSOLVA':'🔴 Online rendelés KIKAPCSOLVA'}async function onlineBetolt(){const v=await call('onlineRendelesAllapot',[]);if(expired(v))return;onlineRender(v===true||(v&&v.online===true))}async function onlineValtas(){const v=await call('onlineRendelesValtas',[]);if(expired(v))return;onlineBetolt()}function soforRender(a){a=Array.isArray(a)?a:[];driverCount.textContent=a.filter(x=>x&&x.dolgozik===true).length;soforLista.innerHTML=a.length?a.map(x=>'<div class="item"><b>'+esc(x.nev||x.felhasznalo)+'</b><div class="meta">'+(x.dolgozik?'🟢 Dolgozik':'⚫ Nem dolgozik')+'<br>'+esc([x.autoSzin,x.autoTipus,x.rendszam].filter(Boolean).join(' • '))+'</div></div>').join(''):'<div class="empty">Nincs sofőr.</div>'}async function soforok(){const v=await call('adminSoforListaLekerdezese',[]);if(expired(v))return;soforRender(Array.isArray(v)?v:(v?.lista||[]))}function fuvarRender(a){a=Array.isArray(a)?a:[];fuvarLista.innerHTML=a.length?a.slice(0,80).map(f=>'<div class="item"><b>'+esc(f.indulas)+' → '+esc(f.cel)+'</b><div class="meta">'+esc(f.datum)+' '+esc(f.ido||'Minél hamarabb')+'<br>'+esc(f.nev||'')+' • '+esc(f.telefon||'')+'<br>Státusz: '+esc(f.statusz||'')+(f.sofor?'<br>Sofőr: '+esc(f.sofor):'')+'</div></div>').join(''):'<div class="empty">Nincs aktív fuvar.</div>'}async function fuvarok(){const v=await call('adminFuvarokLekerdezese',[]);if(expired(v))return;fuvarRender(Array.isArray(v)?v:(v?.lista||[]))}function ertekRender(a){a=Array.isArray(a)?a:[];ertekelesLista.innerHTML=a.length?a.map(e=>'<div class="item"><div class="stars">'+('★'.repeat(Number(e.csillag||0)))+'</div><b>'+esc(e.nev||'Névtelen')+'</b><div class="meta">'+esc(e.datum||'')+'<br>'+esc(e.velemeny||'')+'<br>'+(String(e.allapot||'').toLowerCase()==='jóváhagyva'?'✅ Jóváhagyva':'⏳ Nincs jóváhagyva')+'</div><div class="actions"><button class="btn greenBtn" onclick="ertekAll('+Number(e.sor)+',true,this)">Jóváhagy</button><button class="btn darkBtn" onclick="ertekAll('+Number(e.sor)+',false,this)">Visszavon</button><button class="btn redBtn" onclick="ertekTorol('+Number(e.sor)+',this)">Törlés</button></div></div>').join(''):'<div class="empty">Nincs értékelés.</div>'}async function ertekelesek(){try{const v=await call('adminErtekelesLista',[]);if(expired(v))return;ertekRender(Array.isArray(v)?v:(v?.lista||[]))}catch(e){ertekelesLista.innerHTML='<div class="empty">Kapcsolati hiba.</div>'}}async function ertekAll(s,b,btn){btn.disabled=true;try{const v=await call('adminErtekelesAllapot',[s,b]);if(expired(v))return;if(!v||v.siker===false){alert(v?.uzenet||'Hiba');return}await ertekelesek()}catch(e){alert('Kapcsolati hiba.')}finally{btn.disabled=false}}async function ertekTorol(s,btn){if(!confirm('Törlöd az értékelést?'))return;btn.disabled=true;try{const v=await call('adminErtekelesTorles',[s]);if(!v||v.siker===false){alert(v?.uzenet||'Hiba');return}await ertekelesek()}finally{btn.disabled=false}}function felhasznaloRender(a){a=Array.isArray(a)?a:[];felhasznaloLista.innerHTML=a.length?a.map(u=>'<div class="item"><b>'+esc(u.nev||'')+'</b><div class="meta">'+esc(u.email||'')+'<br>'+esc(u.telefon||'')+'<br><span class="yellow"><b>'+Number(u.pont||0)+' pont</b></span> • '+esc(u.szint||'Bronz')+'<br>'+(u.emailMegerositve?'✅ Email megerősítve':'⏳ Email nincs megerősítve')+'</div><div class="actions"><button class="btn yellowBtn" onclick="pont('+JSON.stringify(u.email||'')+')">Pont adása</button><button class="btn darkBtn" onclick="szerk('+JSON.stringify(u.id||'')+','+JSON.stringify(u.nev||'')+','+JSON.stringify(u.email||'')+','+JSON.stringify(u.telefon||'')+')">Szerkesztés</button><button class="btn redBtn" onclick="torol('+JSON.stringify(u.id||'')+','+JSON.stringify(u.nev||'')+')">Törlés</button></div></div>').join(''):'<div class="empty">Még nincs regisztrált felhasználó.</div>'}async function felhasznalok(){try{const v=await call('adminFelhasznaloLista',[]);if(expired(v))return;felhasznaloRender(v&&v.siker?v.lista:[])}catch(e){felhasznaloLista.innerHTML='<div class="empty">Kapcsolati hiba.</div>'}}async function pont(email){const n=prompt('Hány pontot adjunk? Negatív számmal levonni is lehet.','100');if(n===null)return;const p=Math.floor(Number(n));if(!p)return alert('Adj meg 0-tól eltérő egész számot!');const m=prompt('Megjegyzés:','Admin által hozzáadva')||'Admin által módosítva';const v=await call('adminFelhasznaloPont',[email,p,m]);if(expired(v))return;alert(v?.uzenet||(v?.siker?'Sikeres.':'Nem sikerült.'));if(v&&v.siker)felhasznalok()}async function szerk(id,nev,email,telefon){const n=prompt('Név:',nev);if(n===null)return;const e=prompt('Email:',email);if(e===null)return;const t=prompt('Telefon:',telefon);if(t===null)return;const v=await call('adminFelhasznaloSzerkesztes',[id,{nev:n.trim(),email:e.trim(),telefon:t.trim()}]);if(expired(v))return;alert(v?.uzenet||(v?.siker?'Mentve.':'Nem sikerült.'));if(v&&v.siker)felhasznalok()}async function torol(id,nev){if(!confirm('Biztosan törlöd ezt a felhasználót?\n\n'+nev+'\n\nA ponttörténete is törlődik.'))return;const v=await call('adminFelhasznaloTorles',[id]);if(expired(v))return;alert(v?.uzenet||(v?.siker?'Törölve.':'Nem sikerült.'));if(v&&v.siker)felhasznalok()}function logout(){localStorage.removeItem('adminToken');location.replace('/fiok/')}onlineBetolt();soforok();fuvarok();ertekelesek();felhasznalok();</script></body></html>
