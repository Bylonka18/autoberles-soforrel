<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101d"><title>Értékelések – Autóbérlés sofőrrel</title><style>*{box-sizing:border-box}body{margin:0;background:#070b12;color:#f4f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.wrap{width:min(720px,calc(100% - 22px));margin:auto;padding:24px 0 60px}.card{background:linear-gradient(180deg,#111b2a,#0c141f);border:1px solid #26344a;border-radius:18px;padding:18px;margin-bottom:14px}.yellow{color:#ffc400}.muted{color:#91a0b5}.stars{display:flex;gap:7px;margin:12px 0}.star{font-size:36px;color:#4e5868;cursor:pointer}.star.on{color:#ffc400}label{display:block;margin:12px 0 5px;font-weight:850}input,textarea{width:100%;border:1px solid #34435b;border-radius:11px;background:#09111d;color:#fff;padding:12px;font-size:16px}textarea{min-height:110px}.btn{border:0;border-radius:12px;padding:14px;font-weight:950;cursor:pointer;text-decoration:none;text-align:center}.yellowBtn{background:#ffc400;color:#111827}.darkBtn{background:#26354e;color:#fff}.review{padding:14px 0;border-bottom:1px solid #26344a}.reviewStars{color:#ffc400}.msg{margin-top:10px;font-weight:850}.ok{color:#79e6a4}.err{color:#ff9b9b}</style><script src="/lang.js" defer></script></head><body><main class="wrap"><section class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><b class="yellow">ÉRTÉKELÉSEK</b><h1>Mondd el a véleményed</h1></div><a class="btn darkBtn" style="height:max-content" href="/">Főoldal</a></div><div class="stars"><span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span></div><label>Név</label><input id="nev"><label>Vélemény</label><textarea id="velemeny"></textarea><button id="send" class="btn yellowBtn" style="width:100%;margin-top:12px">ÉRTÉKELÉS KÜLDÉSE</button><div id="msg" class="msg"></div></section><section class="card"><h2>Korábbi értékelések</h2><div id="lista" class="muted">Betöltés...</div></section></main><script>
const API='https://zmqfmxcysugdavmmksky.supabase.co/functions/v1/web-api';let csillag=0;function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function api(m,p={}){const q=new URLSearchParams({muvelet:m,...p});const r=await fetch(API+'?'+q);return await r.json()}document.querySelectorAll('.star').forEach(x=>x.onclick=()=>{csillag=Number(x.dataset.v);document.querySelectorAll('.star').forEach(s=>s.classList.toggle('on',Number(s.dataset.v)<=csillag))});send.onclick=async()=>{if(!csillag||!velemeny.value.trim()){msg.className='msg err';msg.textContent='Válassz csillagot és írj véleményt!';return}send.disabled=true;const v=await api('ertekelesKuldes',{adat:JSON.stringify({nev:nev.value.trim(),velemeny:velemeny.value.trim(),csillag})});msg.className='msg '+(v.siker?'ok':'err');msg.textContent=v.uzenet||'Nem sikerült.';if(v.siker){nev.value=velemeny.value='';csillag=0;document.querySelectorAll('.star').forEach(s=>s.classList.remove('on'))}send.disabled=false};async function load(){const v=await api('ertekelesBetoltes');const a=v.lista||[];lista.innerHTML=a.length?a.map(x=>`<div class="review"><div class="reviewStars">${'★'.repeat(Number(x.csillag||0))}</div><b>${esc(x.nev)}</b><div class="muted">${esc(x.datum)}</div><p>${esc(x.velemeny)}</p></div>`).join(''):'Még nincs jóváhagyott értékelés.'}load();
</script></body></html>
