<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d14">
  <title>Értékelés</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#090d14;color:#f7f8fb;font-family:Arial,Helvetica,sans-serif;min-height:100vh}
    .wrap{max-width:850px;margin:0 auto;padding:20px 14px 40px}
    .brand{font-size:19px;font-weight:950;margin-bottom:18px}.brand span{color:#ffc400}
    .card{background:linear-gradient(180deg,#121925,#0d131e);border:1px solid #263246;border-radius:22px;padding:22px;box-shadow:0 18px 45px rgba(0,0,0,.28);margin-bottom:16px}
    h1{font-size:clamp(30px,7vw,46px);margin:0 0 10px}
    .muted{color:#aeb9c9;line-height:1.55}
    label{display:block;margin:16px 0 7px;font-weight:900}
    input,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #34425a;background:#0b121d;color:white;font-size:16px}
    textarea{min-height:130px;resize:vertical}
    .stars{display:flex;gap:6px;flex-wrap:wrap}
    .star{border:0;background:transparent;color:#526076;font-size:42px;line-height:1;cursor:pointer;padding:2px}
    .star.on{color:#ffc400}
    .submit{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:#ffc400;color:#111827;font-weight:950;font-size:17px;cursor:pointer}
    .submit:disabled{opacity:.6}
    #uzenet{margin-top:12px;font-weight:850;line-height:1.45}
    .atlag{text-align:center;font-size:20px;font-weight:900}.atlag b{color:#ffc400;font-size:32px}
    .review{padding:16px 0;border-bottom:1px solid #263246}.review:last-child{border:0}
    .reviewStars{color:#ffc400;font-size:20px;letter-spacing:2px}
    .reviewName{font-weight:900;margin-top:6px}.reviewDate{font-size:12px;color:#7f8ea4}
    .reviewText{margin-top:9px;line-height:1.55;white-space:pre-wrap}
    .back{display:inline-block;margin-top:8px;color:#ffc400;text-decoration:none;font-weight:850}
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">Autóbérlés sofőrrel <span>– Kiskőrös</span></div>

  <div class="card">
    <h1>⭐ Értékeld a szolgáltatást</h1>
    <div class="muted">Válassz csillagot és írd meg röviden a tapasztalatodat. A vélemény jóváhagyás után jelenhet meg.</div>

    <label>Csillagok</label>
    <div class="stars" id="stars">
      <button class="star" type="button" data-v="1">★</button>
      <button class="star" type="button" data-v="2">★</button>
      <button class="star" type="button" data-v="3">★</button>
      <button class="star" type="button" data-v="4">★</button>
      <button class="star" type="button" data-v="5">★</button>
    </div>

    <label>Név (nem kötelező)</label>
    <input id="nev" maxlength="80" placeholder="Pl. Kovács János">

    <label>Vélemény</label>
    <textarea id="velemeny" maxlength="1200" placeholder="Milyen volt a szolgáltatás?"></textarea>

    <button id="kuldes" class="submit" type="button" onclick="kuldes()">⭐ ÉRTÉKELÉS KÜLDÉSE</button>
    <div id="uzenet"></div>

    <a class="back" href="/rendeles/" target="_top">← Vissza a fuvarrendeléshez</a>
  </div>

  <div class="card">
    <div id="atlag" class="atlag">Értékelések betöltése...</div>
    <div id="lista"></div>
  </div>
</div>

<script>
const SAJAT_API_URL="https://script.google.com/macros/s/AKfycbz_9Rzy2acFm9sOKGJfvghOSt1TO3SCukRd3XJ5j3-YwdqkovGpwflaln63gAEWu74W/exec";
function sajatJsonp(muvelet,params={},timeout=25000){
  return new Promise((resolve,reject)=>{
    const cb='__w_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const q=new URLSearchParams({api:'1',muvelet:muvelet,callback:cb});
    Object.entries(params).forEach(([k,v])=>q.set(k,String(v)));
    const t=setTimeout(()=>{cleanup();reject(new Error('Időtúllépés'));},timeout);
    function cleanup(){clearTimeout(t);delete window[cb];s.remove();}
    window[cb]=d=>{cleanup();resolve(d);};
    s.onerror=()=>{cleanup();reject(new Error('Kapcsolati hiba'));};
    s.src=SAJAT_API_URL+'?'+q.toString();
    document.body.appendChild(s);
  });
}
function sajatWebHivas(nev,args){
  return sajatJsonp('webHivas',{nev:nev,args:encodeURIComponent(JSON.stringify(args||[])),sessionToken:''},30000);
}
window.google=window.google||{};
google.script=google.script||{};
Object.defineProperty(google.script,'run',{
  configurable:true,
  get:function(){
    let ok=function(){},hiba=function(){};
    let proxy;
    proxy=new Proxy({}, {
      get:function(target,prop){
        if(prop==='withSuccessHandler') return function(fn){ok=fn||function(){};return proxy;};
        if(prop==='withFailureHandler') return function(fn){hiba=fn||function(){};return proxy;};
        return function(...args){sajatWebHivas(String(prop),args).then(v=>ok(v)).catch(e=>hiba(e));};
      }
    });
    return proxy;
  }
});
</script>

<script>
let csillag = 0;

document.querySelectorAll('.star').forEach(function(g){
  g.addEventListener('click', function(){
    csillag = Number(g.dataset.v || 0);
    document.querySelectorAll('.star').forEach(function(s){
      s.classList.toggle('on', Number(s.dataset.v) <= csillag);
    });
  });
});

function esc(t){
  return String(t || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function kuldes(){
  const g=document.getElementById('kuldes');
  const u=document.getElementById('uzenet');
  const velemeny=document.getElementById('velemeny').value.trim();

  if(!csillag){u.style.color='#ff8b8b';u.textContent='Válassz csillagot!';return;}
  if(!velemeny){u.style.color='#ff8b8b';u.textContent='Írj pár szót a tapasztalatodról!';return;}

  g.disabled=true;g.textContent='⏳ KÜLDÉS...';u.textContent='';

  google.script.run
    .withSuccessHandler(function(v){
      g.disabled=false;g.textContent='⭐ ÉRTÉKELÉS KÜLDÉSE';
      if(v && v.siker){
        u.style.color='#7fe3a1';u.textContent=v.uzenet;
        document.getElementById('nev').value='';document.getElementById('velemeny').value='';
        csillag=0;document.querySelectorAll('.star').forEach(s=>s.classList.remove('on'));
      }else{u.style.color='#ff8b8b';u.textContent=v && v.uzenet ? v.uzenet : 'Nem sikerült elküldeni.';}
    })
    .withFailureHandler(function(){
      g.disabled=false;g.textContent='⭐ ÉRTÉKELÉS KÜLDÉSE';u.style.color='#ff8b8b';u.textContent='Kapcsolati hiba. Próbáld újra!';
    })
    .ertekelesKuldes({nev:document.getElementById('nev').value.trim(),velemeny:velemeny,csillag:csillag});
}

function betolt(){
  google.script.run
    .withSuccessHandler(function(v){
      if(!v || !v.siker) return;
      const atlag=document.getElementById('atlag');
      const lista=document.getElementById('lista');
      if(!v.darab){atlag.innerHTML='<b>–</b><br><span class="muted">Még nincs jóváhagyott értékelés.</span>';lista.innerHTML='';return;}
      atlag.innerHTML='<b>'+Number(v.atlag||0).toFixed(1)+' / 5</b><br><span class="muted">'+v.darab+' jóváhagyott értékelés</span>';
      lista.innerHTML=(v.lista||[]).map(function(e){
        return '<div class="review">'+
          '<div class="reviewStars">'+'★'.repeat(Number(e.csillag||0))+'☆'.repeat(5-Number(e.csillag||0))+'</div>'+ 
          '<div class="reviewName">'+esc(e.nev)+'</div>'+ 
          '<div class="reviewDate">'+esc(e.datum)+'</div>'+ 
          '<div class="reviewText">'+esc(e.velemeny)+'</div>'+ 
        '</div>';
      }).join('');
    })
    .publikusErtekelesekLekerdezese();
}

betolt();
</script>
</body>
</html>
