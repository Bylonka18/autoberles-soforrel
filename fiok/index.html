<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b12"><title>Fiókom – Autóbérlés sofőrrel</title><style>*{box-sizing:border-box}body{margin:0;background:#060a10;color:#f4f7fb;font-family:Inter,system-ui,Arial}.wrap{width:min(720px,calc(100% - 20px));margin:auto;padding:18px 0 50px}.card{background:linear-gradient(180deg,#111b2a,#0c141f);border:1px solid #26344a;border-radius:18px;padding:18px;margin-bottom:14px}.head{border-color:#d7aa17}.yellow{color:#ffc400}.muted{color:#91a0b5}.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:900;cursor:pointer;text-decoration:none;text-align:center}.yellowBtn,.tab.active{background:#ffc400;color:#111827}.darkBtn,.tab{background:#26354e;color:#fff}.redBtn{background:#4a1720;color:#ffb0b8}.tabs,.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none}label{display:block;margin:10px 0 5px;font-weight:800}input{width:100%;border:1px solid #34435b;border-radius:11px;background:#09111d;color:#fff;padding:12px;font-size:16px}.points{font-size:44px;font-weight:950;color:#ffc400}.level{font-size:24px;font-weight:950}.progress{height:12px;border-radius:999px;background:#172235;overflow:hidden;margin-top:8px}.progress div{height:100%;background:#ffc400}.log{padding:10px 0;border-bottom:1px solid #26344a}.plus{color:#70e5a0}.minus,.err{color:#ff9b9b}.ok{color:#70e5a0}.msg{margin-top:10px;font-weight:800}a{color:#ffc400}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card head"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b class="yellow">ÜGYFÉL FIÓK</b><div class="muted">Pontgyűjtés és tagsági szintek</div></div><a class="btn darkBtn" href="/">Főoldal</a></div></section><section id="auth" class="card"><div class="tabs"><button id="loginTab" class="btn tab active" onclick="tab('login')">BEJELENTKEZÉS</button><button id="regTab" class="btn tab" onclick="tab('reg')">REGISZTRÁCIÓ</button></div><div id="loginBox"><label>Email</label><input id="le" type="email"><label>Jelszó</label><input id="lp" type="password"><button class="btn yellowBtn" style="width:100%;margin-top:12px" onclick="login()">BELÉPÉS</button></div><div id="regBox" class="hidden"><div class="grid"><div><label>Név</label><input id="rn"></div><div><label>Telefon</label><input id="rt" type="tel"></div></div><label>Email</label><input id="re" type="email"><label>Jelszó</label><input id="rp" type="password"><label style="display:flex;gap:9px;align-items:flex-start;font-weight:600"><input id="privacyOk" type="checkbox" style="width:auto;margin-top:5px"><span>Elolvastam és elfogadom az <a href="/adatvedelem/" target="_blank">Adatkezelési tájékoztatót</a>.</span></label><button class="btn yellowBtn" style="width:100%;margin-top:12px" onclick="reg()">REGISZTRÁCIÓ</button><p class="muted">Minden teljesített fuvar +100 pont. Pontot csak regisztrált felhasználó gyűjt.</p></div><div id="authMsg" class="msg"></div></section><section id="profile" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;align-items:start"><div><div id="pnev" class="level"></div><div id="pemail" class="muted"></div></div><button class="btn redBtn" onclick="logout()">Kilépés</button></div><hr style="border-color:#26344a"><div class="muted">Pontegyenleg</div><div><span id="ppont" class="points">0</span> <b>pont</b></div><div id="pszint" class="level"></div><div id="pkov" class="muted"></div><div class="progress"><div id="prog"></div></div></div><div class="card"><b>🎁 Pontok beváltása</b><p class="muted">A megerősítés után a megadott pont azonnal levonódik.</p><input id="redeem" type="number" min="1" placeholder="Pl. 500"><button class="btn yellowBtn" style="width:100%;margin-top:10px" onclick="bevalt()">PONTOK BEVÁLTÁSA</button><div id="redeemMsg" class="msg"></div></div><div class="card"><b>Ponttörténet</b><div id="log"></div></div></section></main><script>const API='https://script.google.com/macros/s/AKfycbz_9Rzy2acFm9sOKGJfvghOSt1TO3SCukRd3XJ5j3-YwdqkovGpwflaln63gAEWu74W/exec';let TOKEN=localStorage.getItem('utasToken')||'';function jsonp(m,p={}){return new Promise((resolve,reject)=>{const cb='__u_'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script'),q=new URLSearchParams({api:'1',muvelet:m,callback:cb});Object.entries(p).forEach(([k,v])=>q.set(k,String(v)));const t=setTimeout(()=>{clean();reject()},30000);function clean(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=d=>{clean();resolve(d)};s.onerror=()=>{clean();reject()};s.src=API+'?'+q;document.body.appendChild(s)})}function call(n,a=[]){return jsonp('webHivas',{nev:n,args:encodeURIComponent(JSON.stringify(a))})}async function hash(x){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}function tab(x){loginBox.classList.toggle('hidden',x!='login');regBox.classList.toggle('hidden',x!='reg');loginTab.classList.toggle('active',x=='login');regTab.classList.toggle('active',x=='reg')}async function reg(){if(!privacyOk.checked){authMsg.className='msg err';authMsg.textContent='A regisztrációhoz el kell fogadnod az Adatkezelési tájékoztatót.';return}const v=await call('torzsFelhasznaloRegisztracio',[{nev:rn.value.trim(),telefon:rt.value.trim(),email:re.value.trim(),jelszoHash:await hash(rp.value)}]);if(v?.siker){TOKEN=v.token;localStorage.setItem('utasToken',TOKEN);await profil()}else{authMsg.className='msg err';authMsg.textContent=v?.uzenet||'Nem sikerült.'}}async function login(){const v=await call('torzsFelhasznaloBelepes',[le.value.trim(),await hash(lp.value)]);if(v?.siker){TOKEN=v.token;localStorage.setItem('utasToken',TOKEN);await profil()}else{authMsg.className='msg err';authMsg.textContent=v?.uzenet||'Nem sikerült.'}}async function profil(){const v=await call('torzsProfilLekerdezese',[TOKEN]);if(!v?.siker){localStorage.removeItem('utasToken');TOKEN='';return}const p=v.profil;auth.classList.add('hidden');profile.classList.remove('hidden');pnev.textContent=p.nev;pemail.textContent=p.email;ppont.textContent=p.pont;pszint.textContent=({Bronz:'🥉',Ezüst:'🥈',Arany:'🥇',Platina:'💎'}[p.szint]||'')+' '+p.szint+' tag';const db=+p.teljesitettFuvar,k=p.kovetkezo;pkov.textContent=k.kell?'Teljesített fuvarok: '+db+' • '+k.kell+' fuvar a '+k.nev+' szintig':'Teljesített fuvarok: '+db+' • Legmagasabb szint';const a=db<10?0:db<25?10:db<50?25:50,c=db<10?10:db<25?25:50;prog.style.width=(db>=50?100:(db-a)/(c-a)*100)+'%';log.innerHTML=(v.naplo||[]).map(x=>'<div class="log"><b class="'+(x.pont>=0?'plus':'minus')+'">'+(x.pont>0?'+':'')+x.pont+' pont</b><div class="muted">'+x.datum+' • '+x.tipus+'</div></div>').join('')||'<p class="muted">Még nincs pontmozgás.</p>'}async function bevalt(){const n=Math.floor(+redeem.value);if(!n)return alert('Add meg a pontot!');if(!confirm('Biztosan beváltasz '+n+' pontot? A pontok azonnal levonódnak.'))return;const v=await call('torzsPontBevaltas',[TOKEN,n]);redeemMsg.className='msg '+(v?.siker?'ok':'err');redeemMsg.textContent=v?.uzenet||'Nem sikerült.';if(v?.siker){redeem.value='';await profil()}}async function logout(){await call('torzsKijelentkezes',[TOKEN]).catch(()=>{});localStorage.removeItem('utasToken');location.reload()}if(TOKEN)profil();</script></body></html>
