<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101d"><title>Fiókom – Autóbérlés sofőrrel</title>
<style>:root{--yellow:#ffc400;--line:#26344a;--muted:#91a0b5}*{box-sizing:border-box}body{margin:0;background:#070b12;color:#f4f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.wrap{width:min(780px,calc(100% - 20px));margin:auto;padding:24px 0 60px}.card{background:linear-gradient(180deg,#111b2a,#0c141f);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.yellow{color:var(--yellow)}.muted{color:var(--muted);line-height:1.5}.hidden{display:none}.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:900;cursor:pointer;text-decoration:none;text-align:center}.yellowBtn{background:var(--yellow);color:#111827}.darkBtn{background:#26354e;color:#fff}.redBtn{background:#6d2630;color:#fff}label{display:block;margin:14px 0 6px;font-weight:850}input{width:100%;border:1px solid #34435b;border-radius:11px;background:#09111d;color:#fff;padding:12px;font-size:16px}.msg{margin-top:12px;font-weight:800}.err{color:#ff9b9b}.ok{color:#79e6a4}.points{font-size:42px;font-weight:950;color:var(--yellow)}.levelBox{margin-top:14px;padding:14px;border:1px solid #26344a;border-radius:14px;background:#09111d}.levelTop{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:900}.levelBar{height:12px;background:#202c3e;border-radius:999px;overflow:hidden;margin:10px 0 8px}.levelFill{height:100%;background:var(--yellow);border-radius:999px;transition:width .3s}.levelNext{font-size:14px}.trip,.log{padding:13px 0;border-bottom:1px solid #26344a}.route{font-weight:900;margin:5px 0}.status{color:var(--yellow);font-size:13px;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}@media(max-width:560px){.row{align-items:flex-start}.actions{grid-template-columns:1fr}}</style><style>
body.authMode{min-height:100vh;background:radial-gradient(circle at 50% 20%,rgba(12,46,69,.28),transparent 38%),linear-gradient(135deg,#06121d,#02070c)}
body.authMode .wrap{width:min(620px,calc(100% - 24px));padding-top:28px}
body.authMode .wrap>section:first-child{display:none}
body.authMode #auth{padding:32px;border:1px solid #c99b00;background:linear-gradient(180deg,rgba(5,24,38,.97),rgba(3,17,28,.99));box-shadow:0 28px 90px rgba(0,0,0,.55)}
body.authMode #auth>.actions{display:none!important}
body.authMode #auth:before{content:"";display:block;width:min(390px,92%);height:210px;margin:0 auto 8px;background:url('/logo.png') center/contain no-repeat}
body.authMode #loginBox h2,body.authMode #regBox h2{text-align:center;font-size:32px;margin:8px 0 28px}
body.authMode input{min-height:50px;background:#06111d}
body.authMode .yellowBtn{min-height:48px}
@media(max-width:620px){body.authMode #auth{padding:22px 18px}body.authMode #auth:before{height:170px}body.authMode #loginBox h2,body.authMode #regBox h2{font-size:27px}}
</style></head>
<body><main class="wrap"><section class="card row"><div><b class="yellow">FIÓKOM</b><div class="muted">Pontok és fuvarok</div></div><a class="btn darkBtn" href="/">Főoldal</a></section>
<section id="auth" class="card"><div class="actions"><button id="loginTab" class="btn yellowBtn">BEJELENTKEZÉS</button><button id="regTab" class="btn darkBtn">REGISZTRÁCIÓ</button></div><div id="loginBox"><h2>Bejelentkezés</h2><label>Email cím</label><input id="loginName" type="email" autocomplete="username"><label>Jelszó</label><input id="loginPassword" type="password" autocomplete="current-password"><button id="loginBtn" class="btn yellowBtn" style="width:100%;margin-top:14px">BELÉPÉS</button></div><div id="regBox" class="hidden"><h2>Regisztráció</h2><label>Név</label><input id="regName"><label>Telefonszám</label><input id="regPhone" type="tel"><label>Email cím</label><input id="regEmail" type="email"><label>Jelszó</label><input id="regPassword" type="password" autocomplete="new-password"><label style="display:flex;gap:9px;align-items:flex-start;font-weight:600"><input id="privacyOk" type="checkbox" style="width:auto;margin-top:5px"><span>Elolvastam az <a href="/adatvedelem/" target="_blank" style="color:#ffc400">Adatkezelési tájékoztatót</a>.</span></label><button id="regBtn" class="btn yellowBtn" style="width:100%;margin-top:14px">REGISZTRÁCIÓ</button></div><div id="authMsg" class="msg"></div></section>
<section id="profile" class="hidden"><div class="card"><div class="row"><div><h2 id="pnev" style="margin:0"></h2><div id="pemail" class="muted"></div></div><button id="logout" class="btn redBtn">Kilépés</button></div><hr style="border-color:#26344a"><div class="muted">Pontegyenleg</div><div><span id="ppont" class="points">0</span> pont</div><div id="pszint" class="yellow"></div><div id="levelBox" class="levelBox"><div class="levelTop"><span id="rideCount">0 teljesített fuvar</span><span id="levelName" class="yellow">Bronz</span></div><div class="levelBar"><div id="levelFill" class="levelFill" style="width:0%"></div></div><div id="levelNext" class="muted levelNext"></div></div><div class="actions"><a class="btn yellowBtn" href="/rendeles/?fiok=1">FUVAR RENDELÉSE</a><button id="refresh" class="btn darkBtn">FRISSÍTÉS</button></div></div>
<div class="card"><h3>Pontok beváltása</h3><input id="redeem" type="number" min="1" step="1" placeholder="Pontok száma"><button id="redeemBtn" class="btn yellowBtn" style="width:100%;margin-top:10px">PONTOK BEVÁLTÁSA</button><div id="redeemMsg" class="msg"></div></div>
<div class="card"><h3>Fuvarjaim</h3><div id="trips" class="muted">Betöltés...</div></div><div class="card"><h3>Ponttörténet</h3><div id="logs" class="muted"></div></div></section></main>
<script>
const API='https://zmqfmxcysugdavmmksky.supabase.co/functions/v1/web-api';
let TOKEN='';
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function jsonp(m,p={},timeout=30000){return new Promise((resolve,reject)=>{const cb='__u_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),q=new URLSearchParams({api:'1',muvelet:m,callback:cb});Object.entries(p).forEach(([k,v])=>q.set(k,String(v)));const t=setTimeout(()=>{clean();reject(new Error('A belépés túl sokáig tart. Próbáld újra!'))},timeout);function clean(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=d=>{clean();resolve(d)};s.onerror=()=>{clean();reject(new Error('Kapcsolati hiba.'))};s.src=API+'?'+q.toString();document.body.appendChild(s)})}
function call(nev,args=[],token=''){return jsonp('webHivas',{nev,args:encodeURIComponent(JSON.stringify(args)),sessionToken:token})}
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function showAuthTab(x){const login=x!=='reg';loginBox.classList.toggle('hidden',!login);regBox.classList.toggle('hidden',login);loginTab.className='btn '+(login?'yellowBtn':'darkBtn');regTab.className='btn '+(login?'darkBtn':'yellowBtn');authMsg.textContent=''}
async function showProfile(p,naplo=[]){auth.classList.add('hidden');profile.classList.remove('hidden');pnev.textContent=p.nev||'Fiókom';pemail.textContent=p.email||'';ppont.textContent=Number(p.pont||0);pszint.textContent=p.szint||'Bronz';const rides=Number(p.teljesitettFuvar||0);rideCount.textContent=rides+' teljesített fuvar';let from=0,to=10,next='Ezüst',bonus=1000;if(rides>=50){from=50;to=50;next='Platina';bonus=0}else if(rides>=25){from=25;to=50;next='Platina';bonus=3000}else if(rides>=10){from=10;to=25;next='Arany';bonus=2000}levelName.textContent=p.szint||'Bronz';const pct=to===from?100:Math.max(0,Math.min(100,Math.round((rides-from)/(to-from)*100)));levelFill.style.width=pct+'%';levelNext.textContent=rides>=50?'Elérted a legmagasabb szintet.':('Még '+Math.max(0,to-rides)+' fuvar kell a '+next+' szinthez és a +'+bonus+' bónuszponthoz.');logs.innerHTML=naplo.length?naplo.map(x=>`<div class="log"><b>${Number(x.pont)>0?'+':''}${Number(x.pont)} pont</b><div class="muted">${esc(x.datum)} · ${esc(x.tipus)} ${x.megjegyzes?'· '+esc(x.megjegyzes):''}</div></div>`).join(''):'Még nincs pontmozgás.';await loadTrips()}
async function load(){const v=await call('torzsProfilLekerdezese',[],TOKEN);if(!v||!v.siker){localStorage.removeItem('utasToken');auth.classList.remove('hidden');profile.classList.add('hidden');authMsg.className='msg err';authMsg.textContent=v?.uzenet||'A bejelentkezés lejárt.';return}await showProfile(v.profil,v.naplo||[])}
async function loadTrips(){const v=await call('torzsSajatFuvarok',[],TOKEN);const list=v&&v.siker?(v.lista||[...(v.aktiv||[]),...(v.elozo||[])]):[];trips.innerHTML=list.length?list.map(x=>`<div class="trip"><span class="status">${esc(x.statusz)}</span><div class="route">${esc(x.indulas)} → ${esc(x.cel)}</div><div class="muted">${esc(x.datum)} ${esc(x.ido||'Minél hamarabb')}</div>${['Megerősítésre vár','Új rendelés','Elvállalva'].includes(x.statusz)?`<a class="btn darkBtn" style="display:inline-block;margin-top:8px" href="/kovetes/?id=${encodeURIComponent(x.azonosito)}">KÖVETÉS</a>`:''}</div>`).join(''):'Még nincs fuvarod.'}
loginBtn.onclick=async()=>{const az=loginName.value.trim(),j=loginPassword.value;if(!az||!j){authMsg.className='msg err';authMsg.textContent='Add meg az email címedet és a jelszót!';return}loginBtn.disabled=true;authMsg.className='msg';authMsg.textContent='Belépés...';try{const v=await call('torzsFelhasznaloBelepes',[az,await hash(j)]);if(!v?.siker)throw new Error(v?.uzenet||'Hibás email vagy jelszó.');TOKEN=v.token;localStorage.setItem('utasToken',TOKEN);if(v.profil)await showProfile(v.profil,[]);else await load()}catch(e){authMsg.className='msg err';authMsg.textContent=e.message||'Nem sikerült belépni.'}finally{loginBtn.disabled=false}};
loginPassword.onkeydown=e=>{if(e.key==='Enter')loginBtn.click()};loginTab.onclick=()=>showAuthTab('login');regTab.onclick=()=>showAuthTab('reg');
regBtn.onclick=async()=>{if(!privacyOk.checked){authMsg.className='msg err';authMsg.textContent='Fogadd el az Adatkezelési tájékoztatót!';return}regBtn.disabled=true;authMsg.textContent='Regisztráció...';try{const v=await call('torzsFelhasznaloRegisztracio',[{nev:regName.value.trim(),telefon:regPhone.value.trim(),email:regEmail.value.trim(),jelszoHash:await hash(regPassword.value)}]);authMsg.className='msg '+(v?.siker?'ok':'err');authMsg.textContent=v?.uzenet||(v?.siker?'Sikeres regisztráció. Erősítsd meg az emailben kapott linkkel.':'Nem sikerült.')}catch{authMsg.className='msg err';authMsg.textContent='Kapcsolati hiba.'}finally{regBtn.disabled=false}};
redeemBtn.onclick=async()=>{const n=Math.floor(Number(redeem.value||0));if(n<1)return;const v=await call('torzsPontBevaltas',[TOKEN,n]);redeemMsg.className='msg '+(v&&v.siker?'ok':'err');redeemMsg.textContent=v?.uzenet||'Nem sikerült.';if(v&&v.siker)load()};
logout.onclick=()=>{localStorage.removeItem('utasToken');TOKEN='';location.replace('/')};refresh.onclick=load;
async function confirmMail(){const kod=new URLSearchParams(location.search).get('megerosites');if(!kod)return;const v=await call('torzsRegisztracioMegerosites',[kod]);authMsg.className='msg '+(v?.siker?'ok':'err');authMsg.textContent=v?.uzenet||'A megerősítés nem sikerült.';if(v?.siker)showAuthTab('login')}
const AUTH_TAB=new URLSearchParams(location.search).get('tab');
TOKEN=localStorage.getItem('utasToken')||'';
if(TOKEN){
  document.body.classList.remove('authMode');
  load();
}else{
  const tab=(AUTH_TAB==='reg')?'reg':'login';
  document.body.classList.add('authMode');
  showAuthTab(tab);
  loginTab.style.display='none';
  regTab.style.display='none';
  confirmMail();
}
</script></body></html>
