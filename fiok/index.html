<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b12"><title>Fiókom – Autóbérlés sofőrrel</title><style>*{box-sizing:border-box}body{margin:0;background:#060a10;color:#f4f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.wrap{width:min(720px,calc(100% - 20px));margin:auto;padding:18px 0 50px}.card{background:linear-gradient(180deg,#111b2a,#0c141f);border:1px solid #26344a;border-radius:18px;padding:18px;margin-bottom:14px}.head{border-color:#d7aa17}.yellow{color:#ffc400}.muted{color:#91a0b5}.tabs,.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:900;cursor:pointer;text-decoration:none;text-align:center}.yellowBtn,.tab.active{background:#ffc400;color:#111827}.darkBtn,.tab{background:#26354e;color:#fff}.redBtn{background:#4a1720;color:#ffb0b8}label{display:block;margin:10px 0 5px;font-weight:800}input{width:100%;border:1px solid #34435b;border-radius:11px;background:#09111d;color:#fff;padding:12px;font-size:16px}.hidden{display:none}.points{font-size:44px;font-weight:950;color:#ffc400}.level{font-size:24px;font-weight:950}.progress{height:12px;border-radius:999px;background:#172235;overflow:hidden;margin-top:8px}.progress>div{height:100%;background:#ffc400}.log{padding:10px 0;border-bottom:1px solid #26344a}.plus{color:#70e5a0}.minus{color:#ff9b9b}.msg{margin-top:10px;font-weight:800}.ok{color:#70e5a0}.err{color:#ff9b9b}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card head"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><b class="yellow">FIÓK</b><div class="muted">Bejelentkezés, pontgyűjtés és adminisztráció</div></div><a class="btn darkBtn" href="/">Főoldal</a></div></section><section id="auth" class="card"><div class="tabs"><button id="loginTab" class="btn tab active" onclick="tab('login')">BEJELENTKEZÉS</button><button id="regTab" class="btn tab" onclick="tab('reg')">REGISZTRÁCIÓ</button></div><div id="loginBox"><label>Email vagy felhasználónév</label><input id="le" autocomplete="username"><label>Jelszó</label><input id="lp" type="password"><button class="btn yellowBtn" style="width:100%;margin-top:12px" onclick="login()">BELÉPÉS</button></div><div id="regBox" class="hidden"><div class="grid"><div><label>Név</label><input id="rn"></div><div><label>Telefon</label><input id="rt" type="tel"></div></div><label>Email</label><input id="re" type="email"><label>Jelszó</label><input id="rp" type="password"><label style="display:flex;gap:9px;align-items:flex-start;font-weight:600"><input id="privacyOk" type="checkbox" style="width:auto;margin-top:5px"><span>Elolvastam és tudomásul vettem az <a href="/adatvedelem/" target="_blank" style="color:#ffc400">Adatkezelési tájékoztatót</a>.</span></label><button class="btn yellowBtn" style="width:100%;margin-top:12px" onclick="reg()">REGISZTRÁCIÓ</button><div class="muted" style="margin-top:9px">A regisztráció után emailben meg kell erősítened a fiókodat.</div></div><div id="authMsg" class="msg"></div></section><section id="adminProfile" class="hidden"><div class="card head"><div class="level">⚙️ Adminisztrátor</div><p class="muted">Admin jogosultsággal jelentkeztél be.</p><a class="btn yellowBtn" style="display:block;width:100%" href="/admin/panel/">ADMINISZTRÁCIÓ MEGNYITÁSA</a><button class="btn redBtn" style="width:100%;margin-top:10px" onclick="logoutAdmin()">Kilépés</button></div></section><section id="profile" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><div id="pnev" class="level"></div><div id="pemail" class="muted"></div></div><button class="btn redBtn" onclick="logout()">Kilépés</button></div><hr style="border-color:#26344a"><div class="muted">Pontegyenleg</div><div><span id="ppont" class="points">0</span> <b>pont</b></div><div id="pszint" class="level"></div><div id="pkov" class="muted"></div><div class="progress"><div id="prog"></div></div></div><div class="card"><b>🎁 Pontok beváltása</b><p class="muted">Írd be, hány pontot szeretnél beváltani.</p><input id="redeem" type="number" min="1" step="1"><button class="btn yellowBtn" style="width:100%;margin-top:10px" onclick="bevalt()">PONTOK BEVÁLTÁSA</button><div id="redeemMsg" class="msg"></div></div><div class="card"><b>Ponttörténet</b><div id="log"></div></div></section></main><script>const API='https://script.google.com/macros/s/AKfycbz_9Rzy2acFm9sOKGJfvghOSt1TO3SCukRd3XJ5j3-YwdqkovGpwflaln63gAEWu74W/exec';let TOKEN=localStorage.getItem('utasToken')||'';function jsonp(m,p={},timeout=30000){return new Promise((resolve,reject)=>{const cb='__u_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),q=new URLSearchParams({api:'1',muvelet:m,callback:cb});Object.entries(p).forEach(([k,v])=>q.set(k,String(v)));const t=setTimeout(()=>{clean();reject(new Error('timeout'))},timeout);function clean(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=d=>{clean();resolve(d)};s.onerror=()=>{clean();reject(new Error('net'))};s.src=API+'?'+q.toString();document.body.appendChild(s)})}function call(nev,args=[]){return jsonp('webHivas',{nev,args:encodeURIComponent(JSON.stringify(args))})}async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}function tab(x){loginBox.classList.toggle('hidden',x!=='login');regBox.classList.toggle('hidden',x!=='reg');loginTab.classList.toggle('active',x==='login');regTab.classList.toggle('active',x==='reg');authMsg.textContent=''}async function reg(){if(!privacyOk.checked){authMsg.className='msg err';authMsg.textContent='A regisztrációhoz el kell olvasnod és tudomásul kell venned az Adatkezelési tájékoztatót.';return}authMsg.className='msg';authMsg.textContent='Regisztráció...';try{const v=await call('torzsFelhasznaloRegisztracio',[{nev:rn.value.trim(),telefon:rt.value.trim(),email:re.value.trim(),jelszoHash:await hash(rp.value)}]);if(v&&v.siker){localStorage.removeItem('utasToken');TOKEN='';authMsg.className='msg ok';authMsg.innerHTML='✅ <b>Sikeres regisztráció!</b><br>Kérlek, erősítsd meg a regisztrációt az emailben kapott linkkel. Ezután tudsz bejelentkezni.';rn.value='';rt.value='';re.value='';rp.value='';privacyOk.checked=false}else{authMsg.className='msg err';authMsg.textContent=v?.uzenet||'Nem sikerült.'}}catch(e){authMsg.className='msg err';authMsg.textContent='Kapcsolati hiba. Próbáld újra!'}}async function login(){const az=le.value.trim(),j=lp.value;if(!az||!j){authMsg.className='msg err';authMsg.textContent='Add meg az emailt/felhasználónevet és a jelszót!';return}authMsg.className='msg';authMsg.textContent='Belépés...';const h=await hash(j);try{const v=await call('torzsFelhasznaloBelepes',[az,h]);if(v&&v.siker){TOKEN=v.token;localStorage.setItem('utasToken',TOKEN);localStorage.removeItem('adminToken');await profil();return}if(v&&v.uzenet&&/erősítsd/i.test(v.uzenet)){authMsg.className='msg err';authMsg.textContent=v.uzenet;return}}catch(e){}try{const a=await jsonp('adminBelepesHash',{felhasznalo:az,jelszoHash:h});if(a&&a.siker){localStorage.setItem('adminToken',a.token);localStorage.removeItem('utasToken');TOKEN='';auth.classList.add('hidden');profile.classList.add('hidden');adminProfile.classList.remove('hidden');return}}catch(e){}authMsg.className='msg err';authMsg.textContent='Hibás email/felhasználónév vagy jelszó.'}async function profil(){if(!TOKEN)return;const v=await call('torzsProfilLekerdezese',[TOKEN]);if(!v||!v.siker){localStorage.removeItem('utasToken');TOKEN='';return}mutat(v.profil,v.naplo||[])}function mutat(p,n){auth.classList.add('hidden');profile.classList.remove('hidden');adminProfile.classList.add('hidden');pnev.textContent=p.nev||'';pemail.textContent=p.email||'';ppont.textContent=Number(p.pont||0);pszint.textContent=({Bronz:'🥉',Ezüst:'🥈',Arany:'🥇',Platina:'💎'}[p.szint]||'')+' '+p.szint+' tag';const db=Number(p.teljesitettFuvar||0),k=p.kovetkezo||{};pkov.textContent=k.kell>0?'Teljesített fuvarok: '+db+' • '+k.kell+' fuvar a '+k.nev+' szintig':'Teljesített fuvarok: '+db+' • Legmagasabb szint';const e=db<10?0:db<25?10:db<50?25:50,c=db<10?10:db<25?25:50;prog.style.width=(db>=50?100:Math.max(0,Math.min(100,(db-e)/(c-e)*100)))+'%';log.innerHTML=n.length?n.map(x=>'<div class="log"><b class="'+(x.pont>=0?'plus':'minus')+'">'+(x.pont>0?'+':'')+x.pont+' pont</b><div class="muted">'+x.datum+' • '+x.tipus+(x.megjegyzes?' • '+x.megjegyzes:'')+'</div></div>').join(''):'<div class="muted" style="padding-top:10px">Még nincs pontmozgás.</div>'}async function bevalt(){const n=Math.floor(Number(redeem.value||0));if(!n)return alert('Add meg a pontot!');if(!confirm('Biztosan beváltasz '+n+' pontot?'))return;const v=await call('torzsPontBevaltas',[TOKEN,n]);redeemMsg.className='msg '+(v&&v.siker?'ok':'err');redeemMsg.textContent=v?.uzenet||'Nem sikerült.';if(v&&v.siker){redeem.value='';await profil()}}async function logoutAdmin(){localStorage.removeItem('adminToken');location.reload()}async function logout(){try{await call('torzsKijelentkezes',[TOKEN])}catch(e){}localStorage.removeItem('utasToken');location.reload()}async function confirmMail(){const kod=new URLSearchParams(location.search).get('megerosites');if(!kod)return false;authMsg.className='msg';authMsg.textContent='Email cím megerősítése...';try{const v=await call('torzsRegisztracioMegerosites',[kod]);authMsg.className='msg '+(v&&v.siker?'ok':'err');authMsg.textContent=v?.uzenet||'A megerősítés nem sikerült.';if(v&&v.siker){tab('login');history.replaceState({},'',location.pathname)}}catch(e){authMsg.className='msg err';authMsg.textContent='Kapcsolati hiba a megerősítés közben.'}return true}(async()=>{const c=await confirmMail();if(!c){if(localStorage.getItem('adminToken')){auth.classList.add('hidden');profile.classList.add('hidden');adminProfile.classList.remove('hidden')}else if(TOKEN)profil()}})();</script></body></html>
